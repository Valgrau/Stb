<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEDCOM Statistieken</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.05);
        }
        .icon { font-size: 2rem; margin-bottom: 8px; }
        .number { font-size: 2.2rem; font-weight: bold; color: #3498db; margin: 8px 0; }
        .label { font-size: 0.95rem; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 GEDCOM Statistieken</h1>
        <div class="grid">
            <div class="card">
                <div class="icon">👥</div>
                <div class="number">26680</div>
                <div class="label">Aantal personen</div>
            </div>
            <div class="card">
                <div class="icon">👨</div>
                <div class="number">0</div>
                <div class="label">Aantal mannen</div>
            </div>
            <div class="card">
                <div class="icon">👩</div>
                <div class="number">0</div>
                <div class="label">Aantal vrouwen</div>
            </div>
            <div class="card">
                <div class="icon">📅</div>
                <div class="number">0</div>
                <div class="label">Met geboortedatum</div>
            </div>
            <div class="card">
                <div class="icon">❓</div>
                <div class="number">26680</div>
                <div class="label">Zonder geboortedatum</div>
            </div>
            <div class="card">
                <div class="icon">🏠</div>
                <div class="number">10766</div>
                <div class="label">Aantal gezinnen</div>
            </div>
        </div>
    </div>
</body>
</html>
