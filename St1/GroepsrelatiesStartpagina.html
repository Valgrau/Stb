<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groepsrelaties Startpagina - URL Overzicht</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f4f7f6;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        #drop-zone {
            border: 3px dashed #3498db;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            background-color: #ffffff;
            color: #7f8c8d;
            font-size: 1.2em;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        #drop-zone.drag-over {
            background-color: #e8f4fc;
            border-color: #2980b9;
            color: #2980b9;
            transform: scale(1.02);
        }

        .add-manual-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .add-btn-main {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn-main:hover {
            background-color: #2196f3;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background: #ffffff;
            margin-bottom: 10px;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .link-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            word-break: break-all;
        }

        .link-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #2c3e50;
            text-decoration: none;
        }

        .link-title:hover {
            text-decoration: underline;
            color: #3498db;
        }

        .link-url {
            font-size: 0.85em;
            color: #7f8c8d;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            margin-left: 15px;
        }

        .btn {
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            font-size: 0.9em;
        }

        .edit-btn {
            background-color: #f39c12;
        }

        .edit-btn:hover {
            background-color: #d68910;
        }

        .delete-btn {
            background-color: #e74c3c;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <h1>Groepsrelaties Startpagina</h1>

    <div id="drop-zone">
        Sleep hier een URL of link naartoe
    </div>

    <div class="add-manual-container">
        <button class="add-btn-main" onclick="addManualUrl()">+ Gekoipieerde OneDrive-koppeling plakken</button>
    </div>

    <ul id="url-list"></ul>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const urlList = document.getElementById('url-list');

        document.addEventListener('DOMContentLoaded', loadLinks);

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-over'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-over'), false);
        });

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            let url = dt.getData('URL') || dt.getData('text/uri-list') || dt.getData('text/plain');

            if (url) {
                processAndAddUrl(url);
            }
        }

        function addManualUrl() {
            let inputUrl = prompt("Plak hier de OneDrive-koppeling of URL:");
            if (inputUrl && inputUrl.trim() !== "") {
                processAndAddUrl(inputUrl.trim());
            }
        }

        function processAndAddUrl(url) {
            let defaultTitle = url.split('/').pop().split('?')[0].replace('.html', '') || url;
            let customTitle = prompt("Voer een titel in voor deze link:", defaultTitle);
            
            if (customTitle !== null) {
                let finalTitle = customTitle.trim() !== "" ? customTitle : url;
                const item = { id: Date.now(), title: finalTitle, url: url };
                addUrlToList(item);
                saveLink(item);
            }
        }

        function addUrlToList(item) {
            const li = document.createElement('li');
            li.setAttribute('data-id', item.id);
            
            const container = document.createElement('div');
            container.className = 'link-container';

            const link = document.createElement('a');
            link.href = item.url;
            link.target = '_blank';
            link.className = 'link-title';
            link.textContent = item.title;

            const urlSub = document.createElement('span');
            urlSub.className = 'link-url';
            urlSub.textContent = item.url;

            container.appendChild(link);
            container.appendChild(urlSub);

            const btnContainer = document.createElement('div');
            btnContainer.className = 'action-btns';

            const editBtn = document.createElement('button');
            editBtn.textContent = 'Titel wijzigen';
            editBtn.className = 'btn edit-btn';
            editBtn.onclick = function() {
                let newTitle = prompt("Voer een nieuwe titel in:", link.textContent);
                if (newTitle && newTitle.trim() !== "") {
                    link.textContent = newTitle;
                    updateLinkTitle(item.id, newTitle);
                }
            };

            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Verwijder';
            deleteBtn.className = 'btn delete-btn';
            deleteBtn.onclick = function() {
                li.remove();
                removeLink(item.id);
            };

            btnContainer.appendChild(editBtn);
            btnContainer.appendChild(deleteBtn);

            li.appendChild(container);
            li.appendChild(btnContainer);
            urlList.appendChild(li);
        }

        function saveLink(item) {
            let links = JSON.parse(localStorage.getItem('savedUrlsData')) || [];
            links.push(item);
            localStorage.setItem('savedUrlsData', JSON.stringify(links));
        }

        function loadLinks() {
            let links = JSON.parse(localStorage.getItem('savedUrlsData')) || [];
            links.forEach(item => addUrlToList(item));
        }

        function updateLinkTitle(id, newTitle) {
            let links = JSON.parse(localStorage.getItem('savedUrlsData')) || [];
            let linkItem = links.find(l => l.id === id);
            if (linkItem) {
                linkItem.title = newTitle;
                localStorage.setItem('savedUrlsData', JSON.stringify(links));
            }
        }

        function removeLink(id) {
            let links = JSON.parse(localStorage.getItem('savedUrlsData')) || [];
            links = links.filter(l => l.id !== id);
            localStorage.setItem('savedUrlsData', JSON.stringify(links));
        }
    </script>
</body>
</html>
