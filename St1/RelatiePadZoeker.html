<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatiepad Zoeker</title>
    <!-- Vis.js Network Bibliotheek -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #1e1e1e; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        #mynetwork { width: 100%; height: 100%; }
        
        #search-container {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(30, 30, 30, 0.95); padding: 20px; border-radius: 8px; color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8); width: 360px; border: 1px solid #444;
        }
        
        .status-banner {
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px dashed #555;
            border-radius: 4px;
            font-size: 12px;
            color: #ddd;
            margin-bottom: 15px;
            text-align: center;
        }

        .file-btn {
            margin-top: 6px;
            padding: 6px 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            width: auto;
        }
        .file-btn:hover { background-color: #2980b9; }

        .input-group { margin-bottom: 12px; position: relative; }
        .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; font-weight: bold; }
        input[type="text"] { width: 93%; padding: 8px; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: white; }
        
        button.calc-btn { 
            width: 100%; padding: 12px; background-color: #4CAF50; color: white; 
            border: none; border-radius: 4px; cursor: pointer; font-weight: bold; 
            font-size: 14px; margin-top: 10px; 
        }
        button.calc-btn:hover { background-color: #45a049; }
        
        .dropdown-list {
            position: absolute; width: 98%; max-height: 180px; overflow-y: auto;
            background: #252525; border: 1px solid #555; border-radius: 4px;
            z-index: 2000; display: none; list-style: none; padding: 0; margin: 2px 0 0 0;
        }
        .dropdown-list li { padding: 8px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #333; }
        .dropdown-list li:hover { background: #383838; color: #4CAF50; }
        
        #path-status { 
            margin-top: 15px; padding: 10px; background: #2a2a2a; 
            border-radius: 4px; font-size: 12px; color: #ffeb3b; 
            border-left: 4px solid #ffeb3b; line-height: 1.4;
        }
        .selected-tag { font-size: 11px; color: #81c784; margin-top: 2px; }
    </style>
</head>
<body>

<div id="search-container">
    <h3 style="margin: 0 0 10px 0; color: #4CAF50;">🌳 Relatiepad Zoeker</h3>
    
    <!-- Status & Bestand Inladen -->
    <div class="status-banner" id="statusBanner">
        <span id="statusText">⏳ Data inladen...</span>
        <input type="file" id="fileInput" accept=".json,.ged" style="display: none;">
        <div>
            <button class="file-btn" onclick="document.getElementById('fileInput').click();">📁 Selecteer Gedcom.json / .ged</button>
        </div>
    </div>

    <!-- Input Persoon VAN -->
    <div class="input-group">
        <label>VAN (Persoon 1):</label>
        <input type="text" id="input-from" placeholder="Typ naam, jaar of ID..." oninput="filterPersons('from')">
        <div id="tag-from" class="selected-tag"></div>
        <ul id="list-from" class="dropdown-list"></ul>
    </div>

    <!-- Input Persoon TOT -->
    <div class="input-group">
        <label>TOT (Persoon 2):</label>
        <input type="text" id="input-to" placeholder="Typ naam, jaar of ID..." oninput="filterPersons('to')">
        <div id="tag-to" class="selected-tag"></div>
        <ul id="list-to" class="dropdown-list"></ul>
    </div>

    <button class="calc-btn" onclick="calculateAndRenderPath()">Bereken & Toon Pad</button>
    
    <div id="path-status">Selecteer twee personen om het relatiepad te berekenen.</div>
</div>

<div id="mynetwork"></div>

<script type="text/javascript">
    const DEFAULT_FILE = 'Gedcom.json';
    let allNodes = {};
    let selectedFromId = null;
    let selectedToId = null;

    // Vis.js Netwerk Initialisatie
    const container = document.getElementById('mynetwork');
    const visNodes = new vis.DataSet([]);
    const visEdges = new vis.DataSet([]);
    const data = { nodes: visNodes, edges: visEdges };

    const options = {
        nodes: { 
            shape: 'box',
            margin: 10,
            borderWidth: 2, 
            shadow: true,
            font: { color: '#000000', size: 14 }
        },
        edges: { smooth: { type: 'cubicBezier', forceDirection: 'vertical' } },
        layout: {
            hierarchical: {
                enabled: true,
                direction: 'UD',
                sortMethod: 'directed',
                nodeSpacing: 220,
                levelSeparation: 130
            }
        },
        interaction: { hover: true },
        physics: { enabled: false }
    };

    const network = new vis.Network(container, data, options);

    // Bij het opstarten proberen Gedcom.json te laden
    window.addEventListener('DOMContentLoaded', () => {
        fetch(DEFAULT_FILE)
            .then(res => {
                if (res.ok) return res.json();
                throw new Error('Geen automatische JSON gevonden');
            })
            .then(jsonData => {
                processLoadedData(jsonData, true);
                updateStatus('✅ <strong>' + DEFAULT_FILE + '</strong> geladen (' + Object.keys(allNodes).length + ' personen)');
            })
            .catch(() => {
                updateStatus('⚠️ Kies een <strong>Gedcom.json</strong> of <strong>.ged</strong> bestand:');
            });
    });

    // Handmatig bestand selecteren
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const content = evt.target.result;
            if (file.name.toLowerCase().endsWith('.json')) {
                try {
                    const jsonData = JSON.parse(content);
                    processLoadedData(jsonData, true);
                    updateStatus('✅ <strong>' + file.name + '</strong> geladen (' + Object.keys(allNodes).length + ' personen)');
                } catch (err) {
                    alert('Ongeldig JSON bestand!');
                }
            } else {
                processLoadedData(content, false);
                updateStatus('✅ GEDCOM <strong>' + file.name + '</strong> geladen (' + Object.keys(allNodes).length + ' personen)');
            }
        };
        reader.readAsText(file);
    });

    function updateStatus(msg) {
        document.getElementById('statusText').innerHTML = msg;
    }

    // Helper functies voor opschonen data
    function cleanId(idStr) {
        if (!idStr) return '';
        if (typeof idStr === 'object') idStr = idStr.value || idStr.val || idStr.text || idStr.id || idStr.xref || '';
        return String(idStr).replace(/@/g, '').trim();
    }

    // Verwerken van Geladen Data (JSON of GEDCOM Text)
    function processLoadedData(rawData, isJson) {
        if (isJson) {
            allNodes = parseGedcomJson(rawData);
        } else {
            allNodes = parseGedcomText(rawData);
        }
    }

    // --- NATIVE GEDCOM TEXT PARSER (JavaScript versie) ---
    function parseGedcomText(text) {
        const individuals = {};
        const families = {};
        let currentObj = null;
        let currentType = null;
        let currentEvent = null;

        const lines = text.split(/\r?\n/);
        lines.forEach(line => {
            line = line.trim();
            if (!line) return;

            const parts = line.split(' ');
            const level = parts[0];
            const tag = parts[1] ? parts[1].toUpperCase() : '';
            const val = parts.slice(2).join(' ');

            if (level === '0') {
                currentEvent = null;
                if (parts.length > 2 && parts[2].toUpperCase() === 'INDI') {
                    const indId = cleanId(parts[1]);
                    currentObj = { id: indId, name: 'Onbekend', gender: 'U', birt: '', deat: '', parents: [], children: [], spouses: [] };
                    individuals[indId] = currentObj;
                    currentType = 'INDI';
                } else if (parts.length > 2 && parts[2].toUpperCase() === 'FAM') {
                    const famId = cleanId(parts[1]);
                    currentObj = { id: famId, husband: null, wife: null, children: [] };
                    families[famId] = currentObj;
                    currentType = 'FAM';
                } else {
                    currentType = null;
                }
            } else if (currentObj) {
                if (currentType === 'INDI') {
                    if (tag === 'NAME') {
                        const cleanName = val.replace(/\//g, '').trim();
                        currentObj.name = cleanName || 'Onbekend';
                    } else if (tag === 'SEX') {
                        currentObj.gender = val.trim().toUpperCase();
                    } else if (tag === 'BIRT' || tag === 'DEAT') {
                        currentEvent = tag;
                    } else if (tag === 'DATE' && currentEvent) {
                        const yearMatch = val.match(/\b\d{3,4}\b/);
                        if (yearMatch) {
                            if (currentEvent === 'BIRT') currentObj.birt = yearMatch[0];
                            if (currentEvent === 'DEAT') currentObj.deat = yearMatch[0];
                        }
                        currentEvent = null;
                    }
                } else if (currentType === 'FAM') {
                    if (tag === 'HUSB') currentObj.husband = cleanId(val);
                    else if (tag === 'WIFE') currentObj.wife = cleanId(val);
                    else if (tag === 'CHIL') currentObj.children.push(cleanId(val));
                }
            }
        });

        return buildNodesFromRelMaps(individuals, families);
    }

    // --- JSON GEDCOM PARSER ---
    function parseGedcomJson(data) {
        const items = extractItems(data);
        const individuals = {};
        const families = {};

        items.forEach(item => {
            const tag = (item.TAG || item.tag || item.type || '').toUpperCase();
            let id = cleanId(item.id || item.ID || item.xref);

            if (tag === 'INDI' && id) {
                individuals[id] = {
                    id: id,
                    name: extractName(item),
                    gender: extractSex(item).toUpperCase() || 'U',
                    birt: String(extractYear(item, 'BIRT') || ''),
                    deat: String(extractYear(item, 'DEAT') || ''),
                    parents: [],
                    children: [],
                    spouses: []
                };
            } else if (tag === 'FAM' && id) {
                families[id] = extractFamMembers(item);
            }
        });

        return buildNodesFromRelMaps(individuals, families);
    }

    function buildNodesFromRelMaps(individuals, families) {
        Object.values(families).forEach(fam => {
            const parents = [fam.husband || fam.husb, fam.wife].filter(Boolean);
            if (fam.husband && fam.wife) {
                if (individuals[fam.husband] && !individuals[fam.husband].spouses.includes(fam.wife)) {
                    individuals[fam.husband].spouses.push(fam.wife);
                }
                if (individuals[fam.wife] && !individuals[fam.wife].spouses.includes(fam.husband)) {
                    individuals[fam.wife].spouses.push(fam.husband);
                }
            }
            (fam.children || []).forEach(childId => {
                if (individuals[childId]) {
                    parents.forEach(pId => {
                        if (!individuals[childId].parents.includes(pId)) individuals[childId].parents.push(pId);
                    });
                }
                parents.forEach(pId => {
                    if (individuals[pId] && !individuals[pId].children.includes(childId)) {
                        individuals[pId].children.push(childId);
                    }
                });
            });
        });

        const nodesData = {};
        for (let id in individuals) {
            const p = individuals[id];
            const datesStr = (p.birt || p.deat) ? `(${p.birt} - ${p.deat})` : '';
            nodesData[id] = {
                id: id,
                name: p.name,
                birt: p.birt,
                deat: p.deat,
                gender: p.gender,
                dates: datesStr,
                parents: p.parents,
                children: p.children,
                spouses: p.spouses
            };
        }
        return nodesData;
    }

    function extractItems(data) {
        if (!data) return [];
        if (Array.isArray(data)) return data;
        if (typeof data === 'object') {
            if (Array.isArray(data.records)) return data.records;
            if (Array.isArray(data.items)) return data.items;
            let list = [];
            for (let k in data) {
                if (Array.isArray(data[k])) list = list.concat(data[k]);
                else if (typeof data[k] === 'object' && data[k] !== null) {
                    let obj = data[k];
                    if (!obj.id) obj.id = k;
                    if (!obj.TAG && !obj.tag) {
                        if (k.startsWith('@I') || k.startsWith('I')) obj.TAG = 'INDI';
                        if (k.startsWith('@F') || k.startsWith('F')) obj.TAG = 'FAM';
                    }
                    list.push(obj);
                }
            }
            return list;
        }
        return [];
    }

    function extractName(item) {
        let name = item.NAME || item.name || '';
        if (typeof name === 'object') name = name.value || name.val || name.text || '';
        if (name) return String(name).replace(/\//g, '').trim();
        return 'Onbekend';
    }

    function extractSex(item) {
        let sex = item.SEX || item.sex || item.gender || '';
        if (typeof sex === 'object') sex = sex.value || sex.val || sex.text || '';
        return String(sex).trim();
    }

    function extractYear(item, tagType) {
        let node = item[tagType] || item[tagType.toLowerCase()];
        let dateStr = '';
        if (typeof node === 'string') dateStr = node;
        else if (typeof node === 'object' && node !== null) {
            dateStr = node.value || node.val || node.DATE || node.date || '';
            if (typeof dateStr === 'object') dateStr = dateStr.value || dateStr.val || '';
        }
        const match = String(dateStr).match(/\b\d{3,4}\b/);
        return match ? match[0] : '';
    }

    function extractFamMembers(item) {
        let husb = cleanId(item.HUSB || item.husb);
        let wife = cleanId(item.WIFE || item.wife);
        let children = [];
        let chil = item.CHIL || item.chil;
        if (chil) {
            if (Array.isArray(chil)) chil.forEach(c => children.push(cleanId(c)));
            else children.push(cleanId(chil));
        }
        return { husband: husb, wife: wife, children: children };
    }

    // --- LIVE ZOEKEN ---
    function filterPersons(type) {
        const input = document.getElementById('input-' + type);
        const list = document.getElementById('list-' + type);
        const query = input.value.toLowerCase().trim();

        list.innerHTML = "";
        if (query.length < 2) { list.style.display = "none"; return; }

        let count = 0;
        for (let id in allNodes) {
            const p = allNodes[id];
            const matchStr = (p.name + " " + p.birt + " " + id).toLowerCase();
            if (matchStr.includes(query)) {
                const li = document.createElement('li');
                li.innerHTML = "<b>" + p.name + "</b> " + p.dates + " <small>(" + id + ")</small>";
                li.onclick = function() {
                    if (type === 'from') selectedFromId = id;
                    else selectedToId = id;
                    input.value = p.name;
                    document.getElementById('tag-' + type).innerText = "Geselecteerd: " + p.name + " (" + id + ")";
                    list.style.display = "none";
                };
                list.appendChild(li);
                count++;
                if (count >= 25) break;
            }
        }
        list.style.display = count > 0 ? "block" : "none";
    }

    // --- RELATIEPAD (BFS ALGORITME) ---
    function findPath(startId, endId) {
        function bfs(allowSpouses) {
            const queue = [[startId]];
            const visited = new Set([startId]);

            while (queue.length > 0) {
                const path = queue.shift();
                const curr = path[path.length - 1];

                if (curr === endId) return path;

                const p = allNodes[curr];
                if (!p) continue;

                const neighbors = [];
                (p.parents || []).forEach(id => neighbors.push(id));
                (p.children || []).forEach(id => neighbors.push(id));
                if (allowSpouses) {
                    (p.spouses || []).forEach(id => neighbors.push(id));
                }

                for (let i = 0; i < neighbors.length; i++) {
                    const nId = neighbors[i];
                    if (!visited.has(nId) && allNodes[nId]) {
                        visited.add(nId);
                        const newPath = path.slice();
                        newPath.push(nId);
                        queue.push(newPath);
                    }
                }
            }
            return null;
        }

        // 1. Eerst bloedverwantschap
        let path = bfs(false);
        if (path) return { path: path, type: "Bloedverwantschap" };

        // 2. Met partners / aangehuwd
        path = bfs(true);
        if (path) return { path: path, type: "Aangehuwde/Gecombineerde relatie" };

        return null;
    }

    function calculateAndRenderPath() {
        const status = document.getElementById('path-status');

        if (!selectedFromId || !selectedToId) {
            status.innerHTML = "⚠️ Selecteer A.U.B. eerst twee personen uit de lijst.";
            return;
        }

        if (selectedFromId === selectedToId) {
            status.innerHTML = "⚠️ Selecteer twee verschillende personen.";
            return;
        }

        const result = findPath(selectedFromId, selectedToId);

        if (!result) {
            status.innerHTML = "❌ <strong>Geen pad gevonden</strong> tussen deze twee personen.";
            visNodes.clear();
            visEdges.clear();
            return;
        }

        const path = result.path;
        status.innerHTML = "<strong>" + result.type + " gevonden!</strong><br>Ketenlengte: " + (path.length - 1) + " stappen (" + path.length + " personen).";

        // Verticaal niveau berekenen voor stamboomweergave
        const levels = {};
        levels[path[0]] = 0;

        for (let i = 0; i < path.length - 1; i++) {
            const u = path[i];
            const v = path[i+1];
            const pU = allNodes[u];

            if ((pU.parents || []).includes(v)) {
                levels[v] = levels[u] - 1; // Ouder hoger
            } else if ((pU.children || []).includes(v)) {
                levels[v] = levels[u] + 1; // Kind lager
            } else {
                levels[v] = levels[u];     // Partner op hetzelfde niveau
            }
        }

        // Knopen opbouwen
        const newNodes = [];
        path.forEach((id, index) => {
            const p = allNodes[id];
            const sexVal = (p.gender || '').toUpperCase();
            let bgColor = sexVal === 'F' ? '#FFB6C1' : (sexVal === 'M' ? '#87CEFA' : '#E0E0E0');
            const labelText = p.name + (p.dates ? "\n" + p.dates : "");

            const nodeObj = {
                id: id,
                label: labelText,
                title: "<b>" + p.name + "</b><br>" + p.dates + "<br>ID: " + id,
                shape: 'box',
                level: levels[id],
                color: { background: bgColor, border: '#444' }
            };

            // Accentueer begin- en eindpunt
            if (index === 0) {
                nodeObj.color = { background: '#4CAF50', border: '#2E7D32' };
                nodeObj.font = { color: '#ffffff', bold: true };
                nodeObj.label = "START:\n" + labelText;
            } else if (index === path.length - 1) {
                nodeObj.color = { background: '#FF5722', border: '#D84315' };
                nodeObj.font = { color: '#ffffff', bold: true };
                nodeObj.label = "EIND:\n" + labelText;
            }

            newNodes.push(nodeObj);
        });

        // Verbindingen opbouwen
        const newEdges = [];
        for (let i = 0; i < path.length - 1; i++) {
            const u = path[i];
            const v = path[i+1];
            const pU = allNodes[u];

            if ((pU.spouses || []).includes(v)) {
                newEdges.push({ from: u, to: v, title: "Partner", color: "#E91E63", width: 3, dashes: true });
            } else if ((pU.children || []).includes(v)) {
                newEdges.push({ from: u, to: v, title: "Ouder -> Kind", color: "#2196F3", width: 2, arrows: "to" });
            } else if ((pU.parents || []).includes(v)) {
                newEdges.push({ from: v, to: u, title: "Ouder -> Kind", color: "#2196F3", width: 2, arrows: "to" });
            }
        }

        visNodes.clear();
        visEdges.clear();
        visNodes.add(newNodes);
        visEdges.add(newEdges);

        network.fit({
            animation: { duration: 500, easingFunction: 'easeInOutQuad' }
        });
    }

    // Sluit dropdowns bij klikken buiten zoekvak
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.input-group')) {
            document.getElementById('list-from').style.display = 'none';
            document.getElementById('list-to').style.display = 'none';
        }
    });
</script>

</body>
</html>
