    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
        }
        #header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #header h1 {
            margin: 0;
            font-size: 22px;
        }

        }
        #mynetwork {

            height: calc(100vh - 70px);
            background-color: #ffffff;
            border-top: 1px solid #dcdcdc;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);

            font-size: 12px;
            line-height: 1.8;
            z-index: 1000;
        }
        .legend-item {
            display: flex;
            align-items: center;
        }
        .color-box {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            border-radius: 3px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div id="header">

<div id="mynetwork"></div>

</div>
