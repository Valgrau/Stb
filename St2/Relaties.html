<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatienetwerk - 5 Invoervelden met Autocomplete</title>
    <!-- Vis.js bibliotheek voor het renderen van het netwerk -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style type="text/css">
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 15px;
            background-color: #FFFFFF;
        }
        #mynetwork {
            width: 100%;
            height: 65vh; /* Iets vergroot omdat de log-console weg is */
            border: 1px solid #BDBDBD;
            background-color: #F8F9FA;
            border-radius: 4px;
            position: relative;
        }
        .toolbar {
            margin-bottom: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            background: #F1F3F4;
            padding: 10px 14px;
            border-radius: 6px;
        }
        .input-group {
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-size: 11px;
            font-weight: bold;
            color: #555;
            margin-bottom: 2px;
        }
        .search-box {
            padding: 6px 10px;
            font-size: 13px;
            width: 200px;
            border: 1px solid #CCC;
            border-radius: 4px;
        }
        /* Autocomplete Popup Stijlen */
        .autocomplete-items {
            position: absolute;
            border: 1px solid #d4d4d4;
            border-bottom: none;
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #fff;
            max-height: 220px;
            overflow-y: auto;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
            border-radius: 0 0 4px 4px;
        }
        .autocomplete-items div {
            padding: 8px 10px;
            cursor: pointer;
            background-color: #fff;
            border-bottom: 1px solid #d4d4d4;
            font-size: 12px;
        }
        .autocomplete-items div:hover {
            background-color: #e9e9e9;
        }
        .autocomplete-active {
            background-color: #2196F3 !important;
            color: #ffffff;
        }

        .btn {
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-calc { background-color: #4CAF50; color: white; }
        .btn-mode { background-color: #2196F3; color: white; }
        .btn-mode.active { background-color: #0D47A1; }
        .btn-file { background-color: #FF9800; color: white; }
        
        .num-box {
            padding: 6px;
            font-size: 13px;
            width: 50px;
            border: 1px solid #CCC;
            border-radius: 4px;
        }
        .info-panel {
            background: #E3F2FD;
            border-left: 5px solid #2196F3;
            padding: 8px 14px;
            margin-bottom: 12px;
            font-size: 13px;
            border-radius: 4px;
        }
        #status {
            font-weight: bold;
            color: #1565C0;
        }
        .drop-zone {
            border: 2px dashed #2196F3;
            background-color: #E3F2FD;
            padding: 15px;
            text-align: center;
            margin-bottom: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .legend {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.92);
            padding: 10px 14px;
            border-radius: 6px;
            box-shadow: 0 0 8px rgba(0,0,0,0.15);
            font-size: 12px;
            line-height: 1.6;
            z-index: 1000;
            border: 1px solid #CCC;
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 3px; }
        .color-box { width: 14px; height: 14px; margin-right: 8px; border-radius: 2px; display: inline-block; }
    </style>
</head>
<body>

<h2>🩸 Relatienetwerk & Bloedverwantschap</h2>

<div class="toolbar">
    <div class="input-group">
        <label>Persoon 1</label>
        <input type="text" id="target1" class="search-box" placeholder="Typ naam..." autocomplete="off">
        <input type="hidden" id="targetId1">
    </div>
    <div class="input-group">
        <label>Persoon 2</label>
        <input type="text" id="target2" class="search-box" placeholder="Typ naam..." autocomplete="off">
        <input type="hidden" id="targetId2">
    </div>
    <div class="input-group">
        <label>Persoon 3 (optioneel)</label>
        <input type="text" id="target3" class="search-box" placeholder="Typ naam..." autocomplete="off">
        <input type="hidden" id="targetId3">
    </div>
    <div class="input-group">
        <label>Persoon 4 (optioneel)</label>
        <input type="text" id="target4" class="search-box" placeholder="Typ naam..." autocomplete="off">
        <input type="hidden" id="targetId4">
    </div>
    <div class="input-group">
        <label>Persoon 5 (optioneel)</label>
        <input type="text" id="target5" class="search-box" placeholder="Typ naam..." autocomplete="off">
        <input type="hidden" id="targetId5">
    </div>

    <div class="input-group">
        <label>Max Gen</label>
        <input type="number" id="maxGenInput" class="num-box" value="8" min="1" max="25">
    </div>

    <div style="display: flex; gap: 8px; align-items: flex-end; margin-top: 15px;">
        <button class="btn btn-calc" onclick="calculateAndRender()">⚡ Berekenen</button>
        <button id="btnBlood" class="btn btn-mode active" onclick="setMode('blood')">Zuiver Bloed</button>
        <button id="btnShortest" class="btn btn-mode" onclick="setMode('shortest')">Kortste Route</button>
        <button class="btn btn-file" onclick="document.getElementById('fileInput').click()">📁 Open JSON</button>
    </div>
    
    <input type="file" id="fileInput" accept=".json,.ged" style="display: none;" onchange="handleFileSelect(event)">
</div>

<div class="info-panel" id="infoPanel">
    <span id="status">Initiëren van script...</span>
</div>

<div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()" style="display:none;">
    📂 <b>Klik hier om Gedcom.json te selecteren</b> of sleep het bestand naar dit vak.
</div>

<div id="mynetwork">
    <div class="legend">
        <strong>Legende (Sleep = vast | Dubbelklik = los):</strong><br>
        <div class="legend-item"><span class="color-box" style="background:#97C2FC; border: 2px solid #D32F2F;"></span> Opgegeven Man (Rode Rand)</div>
        <div class="legend-item"><span class="color-box" style="background:#FFC0CB; border: 2px solid #D32F2F;"></span> Opgegeven Vrouw (Rode Rand)</div>
        <div class="legend-item"><span class="color-box" style="background:#97C2FC; border: 1px solid #555;"></span> Tussenliggende Man</div>
        <div class="legend-item"><span class="color-box" style="background:#FFC0CB; border: 1px solid #555;"></span> Tussenliggende Vrouw</div>
        <hr style="margin: 4px 0;">
        <div class="legend-item"><span style="color:#4CAF50; font-weight:bold; margin-right:5px;">➔</span> Ouder-kind</div>
        <div class="legend-item"><span style="color:#E91E63; font-weight:bold; margin-right:5px;">---</span> Partner</div>
    </div>
</div>

<script type="text/javascript">
    function log(msg, type) {
        // Veilige fallback aangezien het log-element is verwijderd
        console.log('[' + (type || 'info').toUpperCase() + '] ' + msg);
    }

    var personsDB = {};
    var currentMode = 'blood';

    var nodesDataSet = new vis.DataSet();
    var edgesDataSet = new vis.DataSet();

    var container = document.getElementById('mynetwork');
    var data = { nodes: nodesDataSet, edges: edgesDataSet };

    var options = {
        nodes: { font: { size: 13, face: 'Segoe UI' }, margin: 8 },
        edges: { font: { size: 10, align: 'middle' }, smooth: { type: 'continuous' } },
        physics: {
            solver: 'forceAtlas2Based',
            forceAtlas2Based: { gravitationalConstant: -35, centralGravity: 0.01, springLength: 75, springConstant: 0.08 },
            maxVelocity: 50,
            stabilization: { iterations: 150 }
        },
        interaction: { hover: true, tooltipDelay: 150, multiselect: true }
    };

    var network = new vis.Network(container, data, options);

    network.on("dragEnd", function (params) {
        if (params.nodes.length > 0) {
            params.nodes.forEach(function (nodeId) {
                var pointerPos = network.getPositions([nodeId]);
                if (pointerPos[nodeId]) {
                    nodesDataSet.update({ id: nodeId, fixed: { x: true, y: true } });
                }
            });
        }
    });

    network.on("doubleClick", function (params) {
        if (params.nodes.length > 0) {
            params.nodes.forEach(function (nodeId) {
                nodesDataSet.update({ id: nodeId, fixed: false });
            });
        }
    });

    network.on("select", function (params) {
        if (params.nodes.length === 2) {
            highlightPathBetween(params.nodes[0], params.nodes[1]);
        } else if (params.nodes.length === 0) {
            resetHighlighting();
        }
    });

    network.on("deselectNode", function () {
        var selected = network.getSelectedNodes();
        if (selected.length === 2) {
            highlightPathBetween(selected[0], selected[1]);
        } else if (selected.length === 0) {
            resetHighlighting();
        }
    });

    function setStatus(msg, isError) {
        var statusEl = document.getElementById('status');
        if (statusEl) {
            statusEl.innerText = msg;
            statusEl.style.color = isError ? '#D32F2F' : '#1565C0';
        }
        if (isError) {
            document.getElementById('dropZone').style.display = 'block';
        }
    }

    function parseSingleString(node) {
        if (!node) return '';
        if (typeof node === 'string') return node;
        if (typeof node === 'number') return String(node);
        if (Array.isArray(node)) {
            for (var i = 0; i < node.length; i++) {
                var res = parseSingleString(node[i]);
                if (res) return res;
            }
            return '';
        }
        if (typeof node === 'object') {
            if (node.value) return parseSingleString(node.value);
            if (node.val) return parseSingleString(node.val);
            if (node.id) return parseSingleString(node.id);
            if (node.xref) return parseSingleString(node.xref);
        }
        return '';
    }

    function cleanIndiId(raw) {
        if (!raw) return null;
        var str = parseSingleString(raw);
        var cleaned = String(str).replace(/[@\s]/g, "").trim().toUpperCase();
        if (!cleaned) return null;
        if (cleaned.startsWith("I")) return cleaned;
        if (/^\d+$/.test(cleaned)) return "I" + cleaned;
        return cleaned;
    }

    function cleanFamId(raw) {
        if (!raw) return null;
        var str = parseSingleString(raw);
        var cleaned = String(str).replace(/[@\s]/g, "").trim().toUpperCase();
        if (!cleaned) return null;
        if (cleaned.startsWith("F")) return cleaned;
        if (/^\d+$/.test(cleaned)) return "F" + cleaned;
        return cleaned;
    }

    function extractIndiIds(node) {
        var ids = [];
        if (!node) return ids;
        if (typeof node === 'string' || typeof node === 'number') {
            var cid = cleanIndiId(node);
            if (cid && cid.startsWith("I")) ids.push(cid);
        } else if (Array.isArray(node)) {
            node.forEach(function(item) { ids = ids.concat(extractIndiIds(item)); });
        } else if (typeof node === 'object') {
            if (node.value || node.val || node.id || node.xref) {
                var cid = cleanIndiId(node.value || node.val || node.id || node.xref);
                if (cid && cid.startsWith("I")) ids.push(cid);
            }
            Object.keys(node).forEach(function(k) {
                if (['value','val','id','xref','TAG','tag'].indexOf(k) === -1) {
                    ids = ids.concat(extractIndiIds(node[k]));
                }
            });
        }
        return Array.from(new Set(ids));
    }

    function extractFamIds(node) {
        var ids = [];
        if (!node) return ids;
        if (typeof node === 'string' || typeof node === 'number') {
            var cid = cleanFamId(node);
            if (cid && cid.startsWith("F")) ids.push(cid);
        } else if (Array.isArray(node)) {
            node.forEach(function(item) { ids = ids.concat(extractFamIds(item)); });
        } else if (typeof node === 'object') {
            if (node.value || node.val || node.id || node.xref) {
                var cid = cleanFamId(node.value || node.val || node.id || node.xref);
                if (cid && cid.startsWith("F")) ids.push(cid);
            }
            Object.keys(node).forEach(function(k) {
                if (['value','val','id','xref','TAG','tag'].indexOf(k) === -1) {
                    ids = ids.concat(extractFamIds(node[k]));
                }
            });
        }
        return Array.from(new Set(ids));
    }

    function parseYearString(str) {
        if (!str) return '';
        var match = String(str).match(/\b(1\d{3}|20\d{2})\b/);
        return match ? match[1] : '';
    }

    function parseGedcomJson(jsonData) {
        personsDB = {};
        var familiesDB = {};
        var topKeys = Object.keys(jsonData);

        topKeys.forEach(function(key) {
            var item = jsonData[key];
            if (!item || typeof item !== 'object') return;

            var tag = (item.TAG || item.tag || '').toUpperCase();
            var isIndi = (tag === 'INDI') || key.startsWith('@I') || key.startsWith('I');
            var isFam = (tag === 'FAM') || key.startsWith('@F') || key.startsWith('F');

            if (isIndi && !isFam) {
                var cleanedId = cleanIndiId(item.id || item.ID || key);
                if (!cleanedId) return;

                var nameVal = parseSingleString(item.NAME || item.name);
                var nameStr = String(nameVal).replace(/\//g, '').trim() || 'Onbekend';

                var sexVal = parseSingleString(item.SEX || item.sex || item.GENDER);
                var gender = String(sexVal).toUpperCase() || 'U';

                var birtDate = item.BIRT ? parseSingleString(item.BIRT.DATE || item.BIRT.date || item.BIRT) : '';
                var deatDate = item.DEAT ? parseSingleString(item.DEAT.DATE || item.DEAT.date || item.DEAT) : '';

                var birtYear = parseYearString(birtDate);
                var deatYear = parseYearString(deatDate);
                var yearsStr = (birtYear || deatYear) ? "(" + birtYear + " - " + deatYear + ")" : "";

                var famc = extractFamIds(item.FAMC || item.famc);
                var fams = extractFamIds(item.FAMS || item.fams);

                personsDB[cleanedId] = {
                    id: cleanedId,
                    name: nameStr,
                    gender: gender,
                    birt: birtYear,
                    deat: deatYear,
                    years: yearsStr,
                    famc: famc,
                    fams: fams,
                    parents: [],
                    children: [],
                    spouses: []
                };
            } else if (isFam) {
                var cleanedFamId = cleanFamId(item.id || item.ID || key);
                if (!cleanedFamId) return;

                var husbands = extractIndiIds(item.HUSB || item.husb);
                var wives = extractIndiIds(item.WIFE || item.wife);
                var children = extractIndiIds(item.CHIL || item.chil);

                familiesDB[cleanedFamId] = { id: cleanedFamId, husbands: husbands, wives: wives, children: children };
            }
        });

        Object.values(familiesDB).forEach(function(fam) {
            var parents = [].concat(fam.husbands, fam.wives);
            fam.husbands.forEach(function(hId) {
                fam.wives.forEach(function(wId) {
                    if (personsDB[hId] && !personsDB[hId].spouses.includes(wId)) personsDB[hId].spouses.push(wId);
                    if (personsDB[wId] && !personsDB[wId].spouses.includes(hId)) personsDB[wId].spouses.push(hId);
                });
            });
            fam.children.forEach(function(childId) {
                if (personsDB[childId]) {
                    parents.forEach(function(pId) {
                        if (personsDB[pId]) {
                            if (!personsDB[childId].parents.includes(pId)) personsDB[childId].parents.push(pId);
                            if (!personsDB[pId].children.includes(childId)) personsDB[pId].children.push(childId);
                        }
                    });
                }
            });
        });

        Object.values(personsDB).forEach(function(pObj) {
            pObj.famc.forEach(function(fId) {
                var fam = familiesDB[fId];
                if (fam) {
                    var parents = [].concat(fam.husbands, fam.wives);
                    parents.forEach(function(pId) {
                        if (personsDB[pId]) {
                            if (!pObj.parents.includes(pId)) pObj.parents.push(pId);
                            if (!personsDB[pId].children.includes(pObj.id)) personsDB[pId].children.push(pObj.id);
                        }
                    });
                }
            });
        });

        setupAutocomplete();
    }

    function setupAutocomplete() {
        for (let i = 1; i <= 5; i++) {
            let input = document.getElementById("target" + i);
            let hiddenId = document.getElementById("targetId" + i);

            input.addEventListener("input", function() {
                let val = this.value;
                closeAllLists();
                if (!val || val.length < 2) {
                    hiddenId.value = "";
                    return;
                }

                let listDiv = document.createElement("DIV");
                listDiv.setAttribute("id", this.id + "-autocomplete-list");
                listDiv.setAttribute("class", "autocomplete-items");
                this.parentNode.appendChild(listDiv);

                let personsArray = Object.values(personsDB);
                for (let p of personsArray) {
                    if (p.name.toLowerCase().indexOf(val.toLowerCase()) !== -1) {
                        let itemDiv = document.createElement("DIV");
                        itemDiv.innerHTML = "<strong>" + p.name + "</strong> " + (p.years ? p.years : "");
                        itemDiv.innerHTML += "<input type='hidden' value='" + p.id + "' data-name='" + p.name + "'>";
                        
                        itemDiv.addEventListener("click", function() {
                            input.value = p.name;
                            hiddenId.value = p.id;
                            closeAllLists();
                        });
                        listDiv.appendChild(itemDiv);
                    }
                }
            });

            input.addEventListener("blur", function() {
                setTimeout(() => {
                    if (!input.value) hiddenId.value = "";
                }, 200);
            });
        }
    }

    function closeAllLists(elmnt) {
        let items = document.getElementsByClassName("autocomplete-items");
        for (let i = 0; i < items.length; i++) {
            if (elmnt != items[i] && elmnt != event?.target) {
                items[i].parentNode.removeChild(items[i]);
            }
        }
    }

    document.addEventListener("click", function (e) {
        closeAllLists(e.target);
    });

    function initTree(jsonData) {
        try {
            parseGedcomJson(jsonData);
            var pIds = Object.keys(personsDB);
            if (pIds.length === 0) {
                setStatus("⚠️ Geen geldige personen gevonden in het JSON-bestand.", true);
                return;
            }
            document.getElementById('dropZone').style.display = 'none';
            setStatus("✅ " + pIds.length + " personen geladen. Kies personen in de velden hierboven.", false);
        } catch (err) {
            setStatus("⚠️ Fout bij verwerken data: " + err.message, true);
        }
    }

    function handleFileSelect(e) {
        var file = e.target.files[0];
        if (!file) return;
        readFile(file);
    }

    function readFile(file) {
        var reader = new FileReader();
        reader.onload = function(evt) {
            try {
                var json = JSON.parse(evt.target.result);
                initTree(json);
            } catch (err) {
                setStatus("⚠️ Geen geldig JSON-bestand.", true);
            }
        };
        reader.readAsText(file);
    }

    window.addEventListener('load', function() {
        var hasLoaded = false;
        setTimeout(function() {
            if (!hasLoaded) {
                setStatus("⚠️ Klik op 'Open JSON' om je bestand te selecteren.", true);
            }
        }, 2000);

        fetch('Gedcom.json')
            .then(res => { if (!res.ok) throw new Error(); return res.json(); })
            .then(jsonData => { hasLoaded = true; initTree(jsonData); })
            .catch(() => { hasLoaded = true; setStatus("⚠️ Klik op 'Open JSON' om Gedcom.json te selecteren.", true); });
    });

    ['dragover', 'drop'].forEach(function(eventName) {
        window.addEventListener(eventName, function(e) { e.preventDefault(); e.stopPropagation(); });
    });

    window.addEventListener('drop', function(e) {
        if (e.dataTransfer && e.dataTransfer.files.length > 0) readFile(e.dataTransfer.files[0]);
    });

    function getAncestorsWithPaths(startId, maxGenerations) {
        var ancestors = {};
        var queue = [{ id: startId, path: [startId] }];
        while (queue.length > 0) {
            var item = queue.shift();
            if (item.path.length > maxGenerations) continue;
            var pObj = personsDB[item.id];
            if (!pObj) continue;
            pObj.parents.forEach(function(pId) {
                if (!ancestors[pId]) {
                    var newPath = item.path.concat([pId]);
                    ancestors[pId] = newPath;
                    queue.push({ id: pId, path: newPath });
                }
            });
        }
        return ancestors;
    }

    function findBloodRelationships(targetList, maxGen) {
        var nodesToInclude = new Set(targetList);
        var ancestorDict = {};
        targetList.forEach(function(tId) {
            ancestorDict[tId] = getAncestorsWithPaths(tId, maxGen);
        });

        for (var i = 0; i < targetList.length; i++) {
            for (var j = i + 1; j < targetList.length; j++) {
                var p1 = targetList[i], p2 = targetList[j];
                var anc1 = ancestorDict[p1] || {}, anc2 = ancestorDict[p2] || {};
                var common = Object.keys(anc1).filter(a => a in anc2);
                common.forEach(function(mrca) {
                    (anc1[mrca] || []).forEach(n => nodesToInclude.add(n));
                    (anc2[mrca] || []).forEach(n => nodesToInclude.add(n));
                });
            }
        }
        return nodesToInclude;
    }

    function findShortestAnyPath(targetList) {
        var nodesToInclude = new Set(targetList);
        targetList.forEach(function(startId) {
            var visited = new Set([startId]);
            var queue = [[startId]];
            while (queue.length > 0) {
                var path = queue.shift();
                var node = path[path.length - 1];
                if (targetList.includes(node) && node !== startId) {
                    path.forEach(n => nodesToInclude.add(n));
                }
                var pObj = personsDB[node];
                if (!pObj) continue;
                var neighbors = [].concat(pObj.parents, pObj.children, pObj.spouses);
                neighbors.forEach(function(nbr) {
                    if (nbr && !visited.has(nbr)) {
                        visited.add(nbr);
                        queue.push(path.concat([nbr]));
                    }
                });
            }
        });
        return nodesToInclude;
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btnBlood').className = 'btn btn-mode' + (mode === 'blood' ? ' active' : '');
        document.getElementById('btnShortest').className = 'btn btn-mode' + (mode === 'shortest' ? ' active' : '');
        calculateAndRender();
    }

    function calculateAndRender() {
        var targetList = [];
        var targetSet = new Set();

        for (let i = 1; i <= 5; i++) {
            let hiddenId = document.getElementById("targetId" + i).value;
            let textVal = document.getElementById("target" + i).value.trim();

            if (hiddenId && personsDB[hiddenId]) {
                targetList.push(hiddenId);
                targetSet.add(hiddenId);
            } else if (textVal) {
                let found = Object.values(personsDB).find(p => p.name.toLowerCase() === textVal.toLowerCase());
                if (found) {
                    targetList.push(found.id);
                    targetSet.add(found.id);
                }
            }
        }

        var maxGen = parseInt(document.getElementById('maxGenInput').value, 10);
        if (isNaN(maxGen) || maxGen < 1) maxGen = 10;

        if (targetList.length === 0) {
            setStatus("⚠️ Kies ten minste 1 persoon uit de invulvelden.", true);
            return;
        }

        var nodesToInclude = (currentMode === 'blood') 
            ? findBloodRelationships(targetList, maxGen) 
            : findShortestAnyPath(targetList);

        if (nodesToInclude.size === 0) {
            setStatus("⚠️ Geen relaties gevonden voor deze personen binnen deze limiet.", true);
            return;
        }

        renderNetworkGraph(nodesToInclude, targetSet);
        setStatus("✅ Weergave van " + nodesToInclude.size + " personen.", false);
    }

    var currentAdjMap = {};

    function renderNetworkGraph(nodesToInclude, targetSet) {
        nodesDataSet.clear();
        edgesDataSet.clear();
        currentAdjMap = {};

        var newNodes = [];
        var edgesSet = new Set();

        nodesToInclude.forEach(function(id) {
            var p = personsDB[id];
            if (!p) return;

            var isTarget = targetSet.has(id);
            var colorFill = p.gender === 'F' ? "#FFC0CB" : "#97C2FC";
            var borderColor = isTarget ? "#D32F2F" : "#555555";
            var borderWidth = isTarget ? 4 : 1;
            var shape = isTarget ? "ellipse" : "box";

            newNodes.push({
                id: id,
                label: p.name + (p.years ? "\n" + p.years : ""),
                shape: shape,
                color: { background: colorFill, border: borderColor, highlight: { background: "#FFE082", border: "#FF6F00" } },
                borderWidth: borderWidth,
                title: "<b>" + p.name + "</b><br>ID: " + id + "<br>Jaren: " + p.years
            });
            currentAdjMap[id] = [];
        });

        nodesToInclude.forEach(function(id) {
            var p = personsDB[id];
            if (!p) return;

            p.spouses.forEach(function(sId) {
                if (nodesToInclude.has(sId)) {
                    var pairKey = [id, sId].sort().join('-partner-');
                    edgesSet.add(JSON.stringify({ key: pairKey, from: id, to: sId, label: "partner", color: { color: "#E91E63" }, dashes: true, arrows: { to: false } }));
                }
            });

            p.children.forEach(function(cId) {
                if (nodesToInclude.has(cId)) {
                    var pairKey = id + '->' + cId + '-parent';
                    edgesSet.add(JSON.stringify({ key: pairKey, from: id, to: cId, label: "ouder van", color: { color: "#4CAF50" }, arrows: { to: { enabled: true, type: "arrow" } } }));
                }
            });
        });

        var newEdges = [];
        var edgeIndex = 0;
        edgesSet.forEach(function(str) {
            var e = JSON.parse(str);
            e.id = "e_" + (edgeIndex++);
            newEdges.push(e);
            if (currentAdjMap[e.from]) currentAdjMap[e.from].push({ neighbor: e.to, edgeId: e.id });
            if (currentAdjMap[e.to]) currentAdjMap[e.to].push({ neighbor: e.from, edgeId: e.id });
        });

        nodesDataSet.add(newNodes);
        edgesDataSet.add(newEdges);
        network.fit();
    }

    function highlightPathBetween(startId, endId) {
        var queue = [[startId]];
        var visited = new Set([startId]);
        var targetPath = null;

        while (queue.length > 0) {
            var path = queue.shift();
            var current = path[path.length - 1];
            if (current === endId) { targetPath = path; break; }
            (currentAdjMap[current] || []).forEach(function(item) {
                if (!visited.has(item.neighbor)) {
                    visited.add(item.neighbor);
                    queue.push(path.concat([item.neighbor]));
                }
            });
        }
        if (!targetPath) return;

        var pathNodesSet = new Set(targetPath);
        var pathEdgesSet = new Set();
        for (var i = 0; i < targetPath.length - 1; i++) {
            var u = targetPath[i], v = targetPath[i + 1];
            (currentAdjMap[u] || []).forEach(function(item) { if (item.neighbor === v) pathEdgesSet.add(item.edgeId); });
        }

        nodesDataSet.forEach(function(n) {
            nodesDataSet.update({ id: n.id, opacity: pathNodesSet.has(n.id) ? 1 : 0.25 });
        });
        edgesDataSet.forEach(function(e) {
            edgesDataSet.update({ id: e.id, color: { color: pathEdgesSet.has(e.id) ? "#FF6F00" : "#E0E0E0" }, width: pathEdgesSet.has(e.id) ? 4 : 1 });
        });
    }

    function resetHighlighting() {
        nodesDataSet.forEach(function(n) {
            var p = personsDB[n.id];
            if (!p) return;
            nodesDataSet.update({ id: n.id, opacity: 1 });
        });
        edgesDataSet.forEach(function(e) {
            edgesDataSet.update({ id: e.id, color: { color: e.label === "ouder van" ? "#4CAF50" : "#E91E63" }, width: 1 });
        });
    }
</script>
