<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stamboom & Relaties Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .container {
            background-color: #ffffff;
            max-width: 900px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        h1 {
            color: #1a252f;
            margin-bottom: 8px;
            font-size: 26px;
        }
        p.subtitle {
            color: #6c757d;
            margin-bottom: 25px;
            font-size: 15px;
        }
        .section-title {
            font-size: 18px;
            color: #2c3e50;
            margin: 20px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid #e1e4e8;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            display: block;
            text-decoration: none;
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 14px;
            transition: all 0.2s ease-in-out;
        }
        .card:hover {
            border-color: #0366d6;
            box-shadow: 0 4px 12px rgba(3, 102, 214, 0.15);
            transform: translateY(-2px);
        }
        .card h2 {
            font-size: 15px;
            color: #0366d6;
            margin-bottom: 4px;
            word-break: break-word;
        }
        .card p {
            font-size: 12px;
            color: #586069;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Stamboom & Relaties Overzicht</h1>
    <p class="subtitle">Selecteer een visualisatie of hulpmiddel om te openen:</p>

    

    <div class="section-title">Stambomen & Dashboards</div>
   
		<a href="https://valgrau.github.io/St/UitklapStamboom.html" class="card" target="_blank">
            <h2>JS Stamboom Uitklap</h2>
            <p>Uitklap</p>
        </a>
		
    </div>
</div>

</body>
</html>
