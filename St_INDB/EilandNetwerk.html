<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <title>Stamboom Tijdmachine - Volledig</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        #map { height: 100vh; width: 100vw; position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
        
        #upload-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center; padding: 20px;
        }
        .upload-box {
            background: #fff; color: #333; padding: 30px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); max-width: 420px; width: 100%;
        }
        .upload-box input { margin: 15px 0; }

        .time-panel {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(255, 255, 255, 0.95); padding: 12px 20px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center;
            width: 80%; max-width: 450px; display: none;
        }
        .slider { width: 100%; margin-top: 8px; }
        .year-display { font-size: 22px; font-weight: bold; color: #2c3e50; }
        .stats { font-size: 12px; color: #7f8c8d; margin-top: 4px; }

        .custom-count-icon {
            background-color: #2b78e4; color: white; border: 2px solid white;
            border-radius: 50%; font-weight: bold; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .leaflet-popup-content-wrapper { border-radius: 10px; padding: 0; }
        .leaflet-popup-content { margin: 12px 14px !important; width: 280px !important; }
        .popup-container h4 { margin: 0 0 4px 0; color: #2c3e50; font-size: 15px; }
        .popup-list {
            padding-left: 18px; margin: 8px 0 0 0; font-size: 12px; max-height: 200px;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        .popup-list li { margin-bottom: 4px; }
    </style>
</head>
<body>

    <div id="upload-screen">
        <div class="upload-box">
            <h2>Stamboom Tijdmachine</h2>
            <p>Selecteer je GEDCOM-bestand (.ged) om alle personen in te laden:</p>
            <input type="file" id="gedcom-file-input" accept=".ged,.txt"><br>
            <p id="loading-status" style="font-size: 13px; color: #666;"></p>
        </div>
    </div>

    <div id="map"></div>

    <div class="time-panel" id="time-panel">
        <div class="year-display">Jaar: <span id="selected-year">2026</span></div>
        <input type="range" min="1600" max="2026" value="2026" class="slider" id="year-slider">
        <div class="stats"><span id="active-count">0</span> personen zichtbaar</div>
    </div>

<script>
    let persons = [];
    let coords = {};
    let map, markersGroup;

    // Nauwkeurige coördinaten voor de regio (inclusief Binderveld, Sint-Truiden, Hasselt, etc.)
    const exactCoords = {
        "Binderveld, België": [50.8584, 5.1235],
        "Hasselt, België": [50.9304, 5.3378],
        "Sint-Truiden, België": [50.8175, 5.1834],
        "Brussel, België": [50.8503, 4.3517],
        "Leuven, België": [50.8798, 4.7005],
        "Tienen, België": [50.8055, 4.9392],
        "Genk, België": [50.9650, 5.5000],
        "Tongeren, België": [50.7800, 5.4622],
        "Borgloon, België": [50.8045, 5.3456],
        "Nieuwerkerken, België": [50.8845, 5.1822]
    };

    document.getElementById('gedcom-file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        document.getElementById('loading-status').innerText = "Gedcom inlezen (alle 26.000+ personen)...";
        
        const reader = new FileReader();
        reader.onload = function(event) {
            setTimeout(() => {
                parseGedcom(event.target.result);
            }, 50);
        };
        reader.readAsText(file);
    });

    function cleanId(rawId) {
        if (!rawId) return "";
        return rawId.replace(/[^0-9]/g, '');
    }

    function normalizeLocation(locStr) {
        if (!locStr) return null;
        let lower = locStr.toLowerCase();
        
        // Exacte herbewerking zoals in je Python-script voor Binderveld en omstreken
        if (lower.startsWith("binderveld") || lower.includes("binderveld")) {
            return "Binderveld, België";
        }
        if (lower.includes("sint-truiden")) return "Sint-Truiden, België";
        if (lower.includes("hasselt")) return "Hasselt, België";
        if (lower.includes("nieuwerkerken")) return "Nieuwerkerken, België";

        let clean = locStr.split(/[,(]/)[0].trim();
        clean = clean.replace(/\b\d+\b/g, '').trim();
        if (!clean) return null;
        
        if (!clean.toLowerCase().includes('belgi')) {
            clean = `${clean}, België`;
        }
        return clean;
    }

    function parseGedcom(content) {
        const lines = content.split(/\r?\n/);
        let individuals = {};
        let currentType = null;
        let currentId = null;
        let currentObj = null;
        let inBirt = false;
        let inDeat = false;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;

            let parts = line.split(" ", 3);
            let level = parts[0];
            let tag = parts[1] || "";
            let value = parts[2] || "";

            if (level === "0") {
                if (currentType === "INDI" && currentId) {
                    individuals[currentId] = currentObj;
                }
                if (value.includes("INDI") || tag === "INDI") {
                    currentType = "INDI";
                    let raw = (tag !== "INDI") ? tag : (parts[2] || "");
                    currentId = cleanId(raw);
                    currentObj = {
                        id: currentId,
                        name: "Onbekend",
                        birth_year: null,
                        birth_place: null,
                        death_year: null,
                        death_place: null
                    };
                } else {
                    currentType = null;
                    currentId = null;
                    currentObj = null;
                }
                inBirt = false;
                inDeat = false;
            } else if (currentObj && currentType === "INDI") {
                if (level === "1") {
                    inBirt = (tag === "BIRT");
                    inDeat = (tag === "DEAT");
                    if (tag === "NAME") {
                        // Verwijder GEDCOM slashes rondom de familienaam (bijv. /Janssens/)
                        let nameClean = value.replace(/\//g, " ").replace(/\s+/g, " ").trim();
                        if (nameClean) currentObj.name = nameClean;
                    }
                } else if (level === "2") {
                    if (tag === "SURN" && currentObj.name !== "Onbekend") {
                        let surn = value.replace(/\//g, "").trim();
                        if (surn && !currentObj.name.includes(surn)) {
                            currentObj.name += " " + surn;
                        }
                    }
                    if (inBirt) {
                        if (tag === "DATE") {
                            let match = value.match(/\b(1\d{3}|20\d{2})\b/);
                            if (match) currentObj.birth_year = parseInt(match[1]);
                        } else if (tag === "PLAC") {
                            currentObj.birth_place = normalizeLocation(value);
                        }
                    } else if (inDeat) {
                        if (tag === "DATE") {
                            let match = value.match(/\b(1\d{3}|20\d{2})\b/);
                            if (match) currentObj.death_year = parseInt(match[1]);
                        } else if (tag === "PLAC") {
                            currentObj.death_place = normalizeLocation(value);
                        }
                    }
                }
            }
        }
        if (currentType === "INDI" && currentId) {
            individuals[currentId] = currentObj;
        }

        let allPersons = Object.values(individuals);
        persons = [];
        let years = [];

        allPersons.forEach(p => {
            let place = p.birth_place || p.death_place;
            if (place) {
                if (!coords[place]) {
                    if (exactCoords[place]) {
                        coords[place] = exactCoords[place];
                    } else {
                        // Automatische spreiding voor overige locaties
                        let hash = 0;
                        for (let j = 0; j < place.length; j++) hash = place.charCodeAt(j) + ((hash << 5) - hash);
                        let lat = 50.80 + (Math.abs(hash) % 30) / 100;
                        let lng = 4.80 + ((Math.abs(hash) >> 3) % 50) / 100;
                        coords[place] = [lat, lng];
                    }
                }

                persons.push({
                    name: p.name,
                    by: p.birth_year,
                    dy: p.death_year,
                    p: place
                });
                if (p.birth_year) years.push(p.birth_year);
            }
        });

        let minYear = years.length ? Math.min(...years) : 1600;
        let maxYear = 2026;

        document.getElementById('upload-screen').style.display = 'none';
        document.getElementById('time-panel').style.display = 'block';

        const slider = document.getElementById('year-slider');
        slider.min = minYear;
        slider.max = maxYear;
        slider.value = maxYear;
        document.getElementById('selected-year').innerText = maxYear;

        initMap();
        updateMap(maxYear);

        slider.addEventListener('input', function() {
            document.getElementById('selected-year').innerText = this.value;
            setTimeout(() => {
                updateMap(parseInt(this.value));
            }, 10);
        });
    }

    function initMap() {
        map = L.map('map', { preferCanvas: true }).setView([50.8503, 4.3517], 9);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);
        markersGroup = L.layerGroup().addTo(map);
    }

    function updateMap(selectedYear) {
        markersGroup.clearLayers();
        let locationMap = {};
        let activeCount = 0;

        for (let i = 0; i < persons.length; i++) {
            let p = persons.persons ? persons[i] : persons[i]; // Veiligheidscheck
            let bYear = p.by;
            let dYear = p.dy || (bYear ? bYear + 80 : null);

            let isAlive = false;
            if (bYear && bYear <= selectedYear && dYear >= selectedYear) {
                isAlive = true;
            } else if (!bYear && p.dy && p.dy >= selectedYear) {
                isAlive = true;
            }

            if (isAlive) {
                activeCount++;
                if (!locationMap[p.p]) locationMap[p.p] = [];
                locationMap[p.p].push(p);
            }
        }

        for (let place in locationMap) {
            let latLng = coords[place];
            if (latLng) {
                let peopleArray = locationMap[place];
                peopleArray.sort((a, b) => (a.by || 9999) - (b.by || 9999));

                let peopleList = peopleArray.map(item => {
                    let yearStr = item.by ? item.by : 'Onbekend';
                    return `<li><b>${item.name}</b> (Geboren: ${yearStr})</li>`;
                }).join('');
                
                let popupContent = `
                    <div class="popup-container">
                        <h4>${place}</h4>
                        <b>Aantal personen: ${peopleArray.length}</b>
                        <ul class="popup-list">${peopleList}</ul>
                    </div>
                `;

                let countIcon = L.divIcon({
                    className: 'custom-count-icon',
                    html: peopleArray.length,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                L.marker(latLng, { icon: countIcon })
                    .bindPopup(popupContent)
                    .addTo(markersGroup);
            }
        }
        document.getElementById('active-count').innerText = activeCount;
    }
</script>

</body>
</html>
