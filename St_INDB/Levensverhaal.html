    function openGedcomDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => resolve(request.result);
            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME);
                }
            };
        });
    }

    async function getStoredGedcomText() {
        const db = await openGedcomDB();
        return new Promise((resolve) => {
            const transaction = db.transaction(STORE_NAME, 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const req = store.get('gedcomData');
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
        });
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const persoonId = sessionStorage.getItem('levensverhaalPersoonId');
        if (!persoonId) {
            document.getElementById('verhaalContent').innerHTML = '<p style="color: red;">Geen persoon geselecteerd. Ga terug naar de filterpagina en kies een persoon via rechtermuisklik.</p>';
            return;

        try {
            const gedcomText = await getStoredGedcomText();
            if (!gedcomText) {
                document.getElementById('verhaalContent').innerHTML = '<p style="color: red;">Geen stamboomdata gevonden in de database.</p>';
                return;
            }

            setTimeout(() => {
                parseAndGenerateChronologicalStory(gedcomText, persoonId, toonWereld);
            }, 50);
        } catch (err) {
            console.error(err);
            document.getElementById('verhaalContent').innerHTML = '<p style="color: red;">Fout bij het laden van het levensverhaal: ' + err.message + '</p>';
        }
    });

    function parseAndGenerateChronologicalStory(gedcomText, targetId, toonWereld) {
        const lines = gedcomText.split(/\r?\n/);
        let records = [];
        let currentRecord = null;
        let currentEvent = null;

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;
            const parts = trimmed.split(' ');
            const level = parseInt(parts[0], 10);
            if (isNaN(level)) return;

            if (level === 0) {
                if (currentRecord) records.push(currentRecord);
                currentEvent = null;
                let id = '', tag = '';
                if (parts[1].startsWith('@')) {
                    id = parts[1].replace(/@/g, '');
                    tag = parts[2] ? parts[2].toUpperCase() : '';
                } else {
                    tag = parts[1].toUpperCase();
                }
                currentRecord = { TAG: tag, id: id, children: [] };
            } else if (currentRecord) {
                let tag = parts[1] ? parts[1].toUpperCase() : '';
                let value = parts.slice(2).join(' ').replace(/@/g, '');
                const node = { tag: tag, value: value, children: [] };

                if (level === 1) {
                    currentRecord[tag] = value;
                    currentRecord.children.push(node);
                    currentEvent = node;
                } else if (level === 2 && currentEvent) {
                    currentEvent.children.push(node);
                    if (tag === 'DATE') currentEvent.DATE = value;
                    if (tag === 'PLAC') currentEvent.PLAC = value;
                }
            }
        });
        if (currentRecord) records.push(currentRecord);

        let indiMap = {};
        records.forEach(rec => {
            if ((rec.TAG || '').toUpperCase() === 'INDI') {
                indiMap[rec.id] = parsePersonFull(rec);
            }
        });

        let parentFamilies = {}; 
        let parentToChildrenMap = {}; 
        let familyDetails = [];

        records.forEach(rec => {
            if ((rec.TAG || '').toUpperCase() === 'FAM') {
                let husb = '', wife = '', children = [];
                let marrDate = '', marrPlace = '', marrYear = null;

                (rec.children || []).forEach(c => {
                    if (c.tag === 'HUSB') husb = c.value;
                    if (c.tag === 'WIFE') wife = c.value;
                    if (c.tag === 'CHIL') children.push(c.value);
                    if (c.tag === 'MARR') {
                        marrDate = c.DATE || '';
                        marrPlace = c.PLAC || '';
                        if (!marrDate && c.children) {
                            let d = c.children.find(s => s.tag === 'DATE');
                            if (d) marrDate = d.value;
                            let p = c.children.find(s => s.tag === 'PLAC');
                            if (p) marrPlace = p.value;
                        }
                    }
                });

                const match = String(marrDate).match(/\b(\d{3,4})\b/);
                if (match) marrYear = parseInt(match[1], 10);

                familyDetails.push({ husb, wife, marrDate, marrPlace, marrYear });

                children.forEach(chId => {
                    parentFamilies[chId] = { husb, wife };
                });

                if (husb) {
                    if (!parentToChildrenMap[husb]) parentToChildrenMap[husb] = [];
                    parentToChildrenMap[husb].push(...children);
                }
                if (wife) {
                    if (!parentToChildrenMap[wife]) parentToChildrenMap[wife] = [];
                    parentToChildrenMap[wife].push(...children);
                }
            }
        });

        const person = indiMap[targetId];
        if (!person) {
            document.getElementById('verhaalContent').innerHTML = `<p style="color: red;">Persoon met ID ${targetId} niet gevonden in de stamboom.</p>`;
            return;
        }

        let gebJaar = person.birthYear || 1850;
        let overlJaar = person.deatYear || (gebJaar + 80);

        let familieMap = new Map();
        familieMap.set(targetId, "Hoofdpersoon");

        // 1. Ouders (1e graad)
        let oudersIds = [];
        let pFam = parentFamilies[targetId];
        if (pFam) {
            if (pFam.husb && indiMap[pFam.husb]) { oudersIds.push(pFam.husb); familieMap.set(pFam.husb, "Vader"); }
            if (pFam.wife && indiMap[pFam.wife]) { oudersIds.push(pFam.wife); familieMap.set(pFam.wife, "Moeder"); }
        }

        // 2. Grootouders (2e graad)
        let grootoudersIds = [];
        oudersIds.forEach(oId => {
            let oFam = parentFamilies[oId];
            if (oFam) {
                if (oFam.husb && indiMap[oFam.husb]) { grootoudersIds.push(oFam.husb); familieMap.set(oFam.husb, "Grootvader"); }
                if (oFam.wife && indiMap[oFam.wife]) { grootoudersIds.push(oFam.wife); familieMap.set(oFam.wife, "Grootmoeder"); }
            }
        });

        // 3. Nonkels/tantes & neven/nichten (tot 4e graad)
        grootoudersIds.forEach(gId => {
            let oomsTantesKids = parentToChildrenMap[gId] || [];
            oomsTantesKids.forEach(otId => {
                if (indiMap[otId] && otId !== targetId && !oudersIds.includes(otId)) {
                    let p = indiMap[otId];
                    let rol = (p.geslacht === 'M') ? "Nonkel (Oom)" : "Tante";
                    familieMap.set(otId, rol);

                    let nevenNichten = parentToChildrenMap[otId] || [];
                    nevenNichten.forEach(nnId => {
                        if (indiMap[nnId]) {
                            let np = indiMap[nnId];
                            let nnRol = (np.geslacht === 'M') ? "Neef" : "Nicht";
                            familieMap.set(nnId, nnRol);
                        }
                    });
                }
            });
        });

        // Broers en zussen van hoofdpersoon
        oudersIds.forEach(oId => {
            let broersZussen = parentToChildrenMap[oId] || [];
            broersZussen.forEach(bzId => {
                if (indiMap[bzId] && bzId !== targetId) {
                    let p = indiMap[bzId];
                    let rol = (p.geslacht === 'M') ? "Broer" : "Zus";
                    familieMap.set(bzId, rol);

                    let kindBz = parentToChildrenMap[bzId] || [];
                    kindBz.forEach(kbdId => {
                        if (indiMap[kbdId]) {
                            let np = indiMap[kbdId];
                            let nnRol = (np.geslacht === 'M') ? "Neef" : "Nicht";
                            familieMap.set(kbdId, nnRol);
                        }
                    });
                }
            });
        });

        // 4. Partners
        familyDetails.forEach(fam => {
            if ((fam.husb === targetId || fam.wife === targetId) && (familieMap.has(fam.husb) || familieMap.has(fam.wife))) {
                let partnerId = (fam.husb === targetId) ? fam.wife : fam.husb;
                if (partnerId && indiMap[partnerId]) {
                    let p = indiMap[partnerId];
                    let rol = (p.geslacht === 'M') ? "Echtgenoot" : "Echtgenote";
                    familieMap.set(partnerId, rol);
                }
            }
        });

        // 5. Nakomelingen
        let queue = [{ id: targetId, gen: 0 }];
        let visitedDesc = new Set([targetId]);

        while (queue.length > 0) {
            let item = queue.shift();
            if (item.gen < 4) {
                let kids = parentToChildrenMap[item.id] || [];
                kids.forEach(kId => {
                    if (!visitedDesc.has(kId) && indiMap[kId]) {
                        visitedDesc.add(kId);
                        let p = indiMap[kId];
                        let rol = "Nakomeling";
                        if (item.gen === 0) rol = (p.geslacht === 'M') ? "Zoon" : "Dochter";
                        else if (item.gen === 1) rol = (p.geslacht === 'M') ? "Kleinzoon" : "Kleindochter";
                        else if (item.gen === 2) rol = (p.geslacht === 'M') ? "Achterkleinzoon" : "Achterkleindochter";
                        
                        familieMap.set(kId, rol);
                        queue.push({ id: kId, gen: item.gen + 1 });
                    }
                });
            }
        }

        let gebeurtenissen = {};
        let onbekendeGebeurtenissen = [];

        function voegGebeurtenisToe(jaar, tekst) {
            if (jaar && !isNaN(jaar) && jaar >= gebJaar && jaar <= overlJaar) {
                if (!gebeurtenissen[jaar]) gebeurtenissen[jaar] = [];
                gebeurtenissen[jaar].push(tekst);
            } else if (!jaar || isNaN(jaar)) {
                onbekendeGebeurtenissen.push(tekst);
            }
        }

        // Hoofdpersoon
        if (person.birthYear) voegGebeurtenisToe(person.birthYear, `<strong>${person.voornaam} ${person.achternaam}</strong> is geboren ${person.birthPlace ? 'te ' + person.birthPlace : ''}.`);
        if (person.deatYear) voegGebeurtenisToe(person.deatYear, `<strong>${person.voornaam} ${person.achternaam}</strong> is overleden ${person.deatPlace ? 'te ' + person.deatPlace : ''}.`);

        // Huwelijken uitsluitend controleren voor bekende familieleden om vertraging te voorkomen
        familyDetails.forEach(fam => {
            if (familieMap.has(fam.husb) || familieMap.has(fam.wife)) {
                let p1 = indiMap[fam.husb];
                let p2 = indiMap[fam.wife];
                if (p1 && p2) {
                    let r1 = familieMap.get(fam.husb);
                    let r2 = familieMap.get(fam.wife);

                    let omschrijvingP1 = r1 ? ` (${r1.toLowerCase()})` : '';
                    let omschrijvingP2 = r2 ? ` (${r2.toLowerCase()})` : '';

                    let huwelijkTekst = `Huwelijk van <strong>${p1.voornaam} ${p1.achternaam}</strong>${omschrijvingP1} en <strong>${p2.voornaam} ${p2.achternaam}</strong>${omschrijvingP2} ${fam.marrPlace ? 'te ' + fam.marrPlace : ''}.`;

                    if (fam.marrYear) {
                        voegGebeurtenisToe(fam.marrYear, huwelijkTekst);
                    } else {
                        onbekendeGebeurtenissen.push(huwelijkTekst);
                    }
                }
            }
        });

        // Geboorte & Overlijden van alle familieleden
        familieMap.forEach((rol, id) => {
            if (id === targetId) return;
            let p = indiMap[id];
            if (!p) return;

            if (p.birthYear) {
                voegGebeurtenisToe(p.birthYear, `Geboorte van ${rol.toLowerCase()}: <strong>${p.voornaam} ${p.achternaam}</strong> ${p.birthPlace ? 'te ' + p.birthPlace : ''}.`);
            } else {
                onbekendeGebeurtenissen.push(`Geboorte van ${rol.toLowerCase()}: <strong>${p.voornaam} ${p.achternaam}</strong> ${p.birthPlace ? 'te ' + p.birthPlace : ''}.`);
            }

            if (p.deatYear) {
                voegGebeurtenisToe(p.deatYear, `Overlijden van ${rol.toLowerCase()}: <strong>${p.voornaam} ${p.achternaam}</strong> ${p.deatPlace ? 'te ' + p.deatPlace : ''}.`);
            } else if (p.deatDate) {
                onbekendeGebeurtenissen.push(`Overlijden van ${rol.toLowerCase()}: <strong>${p.voornaam} ${p.achternaam}</strong> ${p.deatPlace ? 'te ' + p.deatPlace : ''}.`);
            }
        });

        // Wereldgebeurtenissen
        if (toonWereld) {
            wereldGebeurtenissen.forEach(w => {
                voegGebeurtenisToe(w.jaar, `🌍 <em>Wereldgebeurtenis:</em> ${w.gebeurtenis}`);
            });
        }

        let alleJaren = Object.keys(gebeurtenissen).map(Number).sort((a, b) => a - b);

        let html = `
            <h1>📖 Chronologisch Levensverhaal van ${person.voornaam} ${person.achternaam} (${person.id})</h1>
            
            <div class="info-box">
                <p><strong>Levensperiode:</strong> ${person.birthDate || 'Onbekend'} tot ${person.deatDate || 'Onbekend'} (Jaren ${gebJaar} t/m ${overlJaar})</p>
                <p>Dit overzicht toont gebeurtenissen binnen het leven van deze persoon (inclusief relatieaanduiding bij huwelijken, geboortes en overlijdens van de familie tot de 4e graad).</p>
            </div>
            
            <h2>⏳ Tijdlijn per Jaar</h2>
        `;

        if (alleJaren.length === 0) {
            html += `<p>Geen gedateerde gebeurtenissen gevonden binnen deze levensperiode.</p>`;
        } else {
            alleJaren.forEach(jaar => {
                html += `
                    <div class="timeline-year-group">
                        <div class="timeline-year-title">📅 Jaar ${jaar}</div>
                        <ul>
                            ${gebeurtenissen[jaar].map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    </div>
                `;
            });
        }

        if (onbekendeGebeurtenissen.length > 0) {
            html += `
                <div class="unknown-section">
                    <h3>❓ Gebeurtenissen zonder bekende datum of jaar</h3>
                    <ul>
                        ${onbekendeGebeurtenissen.map(item => `<li>${item}</li>`).join('')}
                    </ul>
                </div>
            `;
        }

        document.getElementById('verhaalContent').innerHTML = html;
    }

    function parsePersonFull(rec) {
        let voornaam = '', achternaam = '', geslacht = '-';
        let birthDate = '', birthPlace = '', birthYear = null;
        let deatDate = '', deatPlace = '', deatYear = null;

        (rec.children || []).forEach(c => {
            if (c.tag === 'SEX') geslacht = c.value ? c.value.trim().toUpperCase() : '-';
            if (c.tag === 'NAME') {
                let rawName = c.value || '';
                if (rawName.includes('/')) {
                    let parts = rawName.split('/');
                    voornaam = parts[0].trim();
                    achternaam = parts[1] ? parts[1].trim() : '';
                } else {
                    voornaam = rawName;
                }
                if (c.children) {
                    c.children.forEach(sub => {
                        if (sub.tag === 'GIVN') voornaam = sub.value.trim();
                        if (sub.tag === 'SURN') achternaam = sub.value.trim();
                    });
                }
            }
            if (c.tag === 'BIRT') {
                birthDate = c.DATE || '';
                birthPlace = c.PLAC || '';
                if (!birthDate && c.children) {
                    let d = c.children.find(s => s.tag === 'DATE');
                    if (d) birthDate = d.value;
                    let p = c.children.find(s => s.tag === 'PLAC');
                    if (p) birthPlace = p.value;
                }
                const match = String(birthDate).match(/\b(\d{3,4})\b/);
                if (match) birthYear = parseInt(match[1], 10);
            }
            if (c.tag === 'DEAT') {
                deatDate = c.DATE || '';
                deatPlace = c.PLAC || '';
                if (!deatDate && c.children) {
                    let d = c.children.find(s => s.tag === 'DATE');
                    if (d) deatDate = d.value;
                    let p = c.children.find(s => s.tag === 'PLAC');
                    if (p) deatPlace = p.value;
                }
                const match = String(deatDate).match(/\b(\d{3,4})\b/);
                if (match) deatYear = parseInt(match[1], 10);
            }
        });

        return { id: rec.id, voornaam, achternaam, geslacht, birthDate, birthPlace, birthYear, deatDate, deatPlace, deatYear };
    }
</script>
