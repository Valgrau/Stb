    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style type="text/css">

            margin-bottom: 8px;

    </style>
</head>

    Laatste update van deze pagina: <span id="lastMod"></span>
</footer>
<body>

<h2>🌳 Hiërarchisch Relatienetwerk (Stamboom met Stamouders Boven)</h2>

<div class="toolbar">
    <div class="input-group">
        <label>Selecteer Favorietenlijst</label>
        <select id="favoriteListSelect" class="search-box" onchange="calculateAndRender()">
            <option value="">-- Laad favorietenlijsten... --</option>
        </select>
    </div>

    <div class="input-group">
        <label>Max Gen</label>
        <input type="number" id="maxGenInput" class="num-box" value="8" min="1" max="25" onchange="calculateAndRender()">
    </div>

    <div style="display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap;">
        <button class="btn btn-calc" onclick="calculateAndRender()">⚡ Herberekenen</button>
        <button id="btnBlood" class="btn btn-mode active" onclick="setMode('blood')">Zuiver Bloed</button>
        <button id="btnShortest" class="btn btn-mode" onclick="setMode('shortest')">Kortste Route</button>
        <button class="btn btn-file" onclick="window.location.href='index.html'">🏠 Startpagina</button>
        <button class="btn btn-copy" onclick="copySelectedPath()">📋 Kopieer Pad</button>
    </div>
</div>

<div class="info-panel" id="infoPanel">
    <span id="status">⏳ Initialiseren...</span>
</div>

<div id="mynetwork">
    <div class="legend">
        <strong>Legende (Stamboom):</strong><br>
        <div class="legend-item"><span class="color-box" style="background:#97C2FC; border: 2px solid #D32F2F;"></span> Opgegeven Man (Rode Rand)</div>
        <div class="legend-item"><span class="color-box" style="background:#FFC0CB; border: 2px solid #D32F2F;"></span> Opgegeven Vrouw (Rode Rand)</div>
        <div class="legend-item"><span class="color-box" style="background:#97C2FC; border: 1px solid #555;"></span> Tussenliggende Man</div>
        <div class="legend-item"><span class="color-box" style="background:#FFC0CB; border: 1px solid #555;"></span> Tussenliggende Vrouw</div>
        <hr style="margin: 4px 0;">
        <div class="legend-item"><span style="color:#4CAF50; font-weight:bold; margin-right:5px;">➔</span> Ouder-kind</div>
        <div class="legend-item"><span style="color:#E91E63; font-weight:bold; margin-right:5px;">---</span> Partner</div>
    </div>
</div>

<script type="text/javascript">
    const DB_NAME = 'GedcomDatabase';
    const STORE_NAME = 'gedcomStore';
    const FAV_STORE_NAME = 'favoritesStore';
    const DB_VERSION = 5;

    function setStatus(msg, isError) {
        console.log("LOG:", msg);
        var statusEl = document.getElementById('status');
        if (statusEl) {
            statusEl.innerText = msg;
            statusEl.style.color = isError ? '#D32F2F' : '#1565C0';
        }
    }

    function openGedcomDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => resolve(request.result);
            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
                if (!db.objectStoreNames.contains(FAV_STORE_NAME)) db.createObjectStore(FAV_STORE_NAME, { keyPath: 'id' });
            };
        });
    }

    async function getGedcomFromIDB() {
        const db = await openGedcomDB();
        return new Promise((resolve, reject) => {
            const transaction = db.transaction(STORE_NAME, 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.get('gedcomData');
            request.onsuccess = () => resolve(request.result || null);
            request.onerror = () => reject(request.error);
        });
    }

    async function loadFavoritesIntoDropdown() {
        try {
            var db = await openGedcomDB();
            if (!db.objectStoreNames.contains(FAV_STORE_NAME)) return;
            var favs = await new Promise((resolve, reject) => {
                var transaction = db.transaction(FAV_STORE_NAME, 'readonly');
                var store = transaction.objectStore(FAV_STORE_NAME);
                var request = store.getAll();
                request.onsuccess = () => resolve(request.result || []);
                request.onerror = () => reject(request.error);
            });

            var select = document.getElementById('favoriteListSelect');
            var currentVal = select.value;
            select.innerHTML = '<option value="">-- Selecteer een favorietenlijst --</option>';

            favs.forEach(fav => {
                var opt = document.createElement('option');
                opt.value = fav.id;
                opt.text = fav.name + ' (' + fav.ids.length + ' personen)';
                opt.dataset.ids = JSON.stringify(fav.ids);
                select.appendChild(opt);
            });

            if (currentVal) select.value = currentVal;
        } catch (err) {
            console.error("Fout bij laden favorietenlijsten:", err);
        }
    }

    var personsDB = {};
    var currentMode = 'blood';
    var lastSelectedPathNames = []; 
    var lastPathStartName = "";
    var lastPathEndName = "";
    var lastPathCode = "";
    var changeIndices = [];
    var currentTargetSet = new Set();

    var nodesDataSet = new vis.DataSet();
    var edgesDataSet = new vis.DataSet();

    var container = document.getElementById('mynetwork');
    var data = { nodes: nodesDataSet, edges: edgesDataSet };

    // Opties geoptimaliseerd om stamouders geforceerd bovenaan te houden en overlappingen te vermijden
    var options = {
        nodes: { 
            font: { size: 12, face: 'Segoe UI' }, 
            margin: 10,
            widthConstraint: { maximum: 180 }
        },
        edges: { 
            font: { size: 10, align: 'middle' }, 
            smooth: { type: 'cubicBezier', roundness: 0.3 } 
        },
        layout: {
            hierarchical: {
                enabled: true,
                direction: 'UD',         // Van boven naar beneden
                sortMethod: 'directed',  // Volgt strikt de ouder-kind richtlijnen
                nodeSpacing: 180,        // Ruimte tussen knooppunten in de breedte
                levelSeparation: 130,    // Vaste hoogte per generatie
                treeSpacing: 220,        // Ruimte tussen afzonderlijke takken
                blockShifting: true,
                edgeMinimization: true,
                parentCentralization: true,
                shakeTowards: 'roots'    // Trekt de hiërarchie krachtig naar de top
            }
        },
        physics: { enabled: false },
        interaction: { hover: true, tooltipDelay: 300, multiselect: true }
    };

    var network = new vis.Network(container, data, options);
    const pathColors = ["#9C27B0", "#E91E63", "#00BCD4", "#FF9800", "#3F51B5", "#8BC34A"];

    network.on("hoverNode", function (params) {
        var nodeId = params.node;
        if (currentTargetSet.has(nodeId)) {
            highlightAllPathsBetweenTargetsWithUniqueColors(nodeId);
        }
    });

    network.on("blurNode", function (params) {
        var nodeId = params.node;
        if (currentTargetSet.has(nodeId)) {
            var selected = network.getSelectedNodes();
            if (selected.length === 2) {
                highlightPathBetween(selected[0], selected[1]);
            } else {
                resetHighlighting();
            }
        }
    });

    function highlightAllPathsBetweenTargetsWithUniqueColors(hoveredId) {
        var targets = Array.from(currentTargetSet);
        var edgeColorMap = {};
        var activePathNodes = new Set([hoveredId]);
        let colorIdx = 0;

        targets.forEach(function(targetId) {
            if (targetId === hoveredId) return;

            var queue = [[hoveredId]];
            var visited = new Set([hoveredId]);
            var foundPath = null;

            while (queue.length > 0) {
                var path = queue.shift();
                var current = path[path.length - 1];
                if (current === targetId) { foundPath = path; break; }
                (currentAdjMap[current] || []).forEach(function(item) {
                    if (!visited.has(item.neighbor)) {
                        visited.add(item.neighbor);
                        queue.push(path.concat([item.neighbor]));
                    }
                });
            }

            if (foundPath) {
                foundPath.forEach(n => activePathNodes.add(n));
                var assignedColor = pathColors[colorIdx % pathColors.length];
                colorIdx++;

                for (var i = 0; i < foundPath.length - 1; i++) {
                    var u = foundPath[i], v = foundPath[i + 1];
                    (currentAdjMap[u] || []).forEach(function(item) {
                        if (item.neighbor === v) {
                            edgeColorMap[item.edgeId] = assignedColor;
                        }
                    });
                }
            }
        });

        nodesDataSet.forEach(function(n) {
            nodesDataSet.update({ id: n.id, opacity: activePathNodes.has(n.id) ? 1 : 0.25 });
        });
        edgesDataSet.forEach(function(e) {
            var isHighlight = edgeColorMap[e.id] !== undefined;
            edgesDataSet.update({ 
                id: e.id, 
                color: { color: isHighlight ? edgeColorMap[e.id] : "#E0E0E0" }, 
                width: isHighlight ? 4 : 1 
            });
        });
    }

    network.on("select", function (params) {
        if (params.nodes.length === 2) {
            highlightPathBetween(params.nodes[0], params.nodes[1]);
        } else if (params.nodes.length === 0) {
            resetHighlighting();
        }
    });

    network.on("deselectNode", function () {
        var selected = network.getSelectedNodes();
        if (selected.length === 2) {
            highlightPathBetween(selected[0], selected[1]);
        } else if (selected.length === 0) {
            resetHighlighting();
        }
    });

    function parseYearString(str) {
        if (!str) return '';
        var match = String(str).match(/\b(1\d{3}|20\d{2})\b/);
        return match ? match[1] : '';
    }

    function parseGedcomText(gedcomText) {
        personsDB = {};
        var rawFams = {};
        
        var lines = gedcomText.split(/\r?\n/);
        var currentRecordType = null;
        var currentIndi = null;
        var currentFam = null;
        var currentSubTag = null;

        lines.forEach(function(line) {
            var trimmed = line.trim();
            if (!trimmed) return;

            var parts = trimmed.split(' ');
            var level = parseInt(parts[0], 10);
            var tag = '';
            var val = '';
            var id = '';

            if (isNaN(level)) return;

            if (parts[1] && parts[1].startsWith('@') && parts[1].endsWith('@')) {
                id = parts[1].replace(/@/g, '');
                tag = parts[2] ? parts[2].toUpperCase() : '';
                val = parts.slice(3).join(' ');
            } else {
                tag = parts[1] ? parts[1].toUpperCase() : '';
                val = parts.slice(2).join(' ');
            }

            if (level === 0) {
                currentIndi = null;
                currentFam = null;
                currentRecordType = null;

                if (tag === 'INDI') {
                    currentRecordType = 'INDI';
                    currentIndi = {
                        id: id,
                        name: 'Onbekend',
                        gender: 'U',
                        birt: '',
                        deat: '',
                        years: '',
                        famc: [],
                        fams: [],
                        parents: [],
                        children: [],
                        spouses: []
                    };
                    personsDB[id] = currentIndi;
                } else if (tag === 'FAM') {
                    currentRecordType = 'FAM';
                    currentFam = {
                        id: id,
                        husb: [],
                        wife: [],
                        children: []
                    };
                    rawFams[id] = currentFam;
                }
            } else if (level === 1) {
                currentSubTag = tag;
                if (currentRecordType === 'INDI' && currentIndi) {
                    if (tag === 'SEX') {
                        currentIndi.gender = val.trim().toUpperCase();
                    } else if (tag === 'NAME') {
                        currentIndi.name = val.replace(/\//g, '').trim();
                    } else if (tag === 'FAMC') {
                        var fId = val.replace(/@/g, '').trim();
                        if (fId) currentIndi.famc.push(fId);
                    } else if (tag === 'FAMS') {
                        var fId = val.replace(/@/g, '').trim();
                        if (fId) currentIndi.fams.push(fId);
                    }
                } else if (currentRecordType === 'FAM' && currentFam) {
                    if (tag === 'HUSB') {
                        var hId = val.replace(/@/g, '').trim();
                        if (hId) currentFam.husb.push(hId);
                    } else if (tag === 'WIFE') {
                        var wId = val.replace(/@/g, '').trim();
                        if (wId) currentFam.wife.push(wId);
                    } else if (tag === 'CHIL') {
                        var cId = val.replace(/@/g, '').trim();
                        if (cId) currentFam.children.push(cId);
                    }
                }
            } else if (level === 2 || level === 3) {
                if (currentRecordType === 'INDI' && currentIndi) {
                    if ((currentSubTag === 'BIRT' || currentSubTag === 'DEAT') && tag === 'DATE') {
                        var yr = parseYearString(val);
                        if (yr) {
                            if (currentSubTag === 'BIRT') currentIndi.birt = yr;
                            if (currentSubTag === 'DEAT') currentIndi.deat = yr;
                        }
                    }
                }
            }
        });

        Object.values(personsDB).forEach(function(p) {
            if (p.birt || p.deat) {
                p.years = "(" + p.birt + " - " + p.deat + ")";
            }
        });

        Object.values(rawFams).forEach(function(fam) {
            var parents = [].concat(fam.husb, fam.wife);
            fam.husb.forEach(function(hId) {
                fam.wife.forEach(function(wId) {
                    if (personsDB[hId] && !personsDB[hId].spouses.includes(wId)) personsDB[hId].spouses.push(wId);
                    if (personsDB[wId] && !personsDB[wId].spouses.includes(hId)) personsDB[wId].spouses.push(hId);
                });
            });
            fam.children.forEach(function(childId) {
                if (personsDB[childId]) {
                    parents.forEach(function(pId) {
                        if (personsDB[pId]) {
                            if (!personsDB[childId].parents.includes(pId)) personsDB[childId].parents.push(pId);
                            if (!personsDB[pId].children.includes(childId)) personsDB[pId].children.push(childId);
                        }
                    });
                }
            });
        });

        loadFavoritesIntoDropdown();
    }

    async function initTreeFromIndexedDB() {
        try {
            var savedData = await getGedcomFromIDB();
            if (!savedData) {
                setStatus("⚠️ Geen stamboom gevonden in IndexedDB.", true);
                return;
            }

            parseGedcomText(savedData);
            var pIds = Object.keys(personsDB);
            if (pIds.length === 0) {
                setStatus("⚠️ Geen geldige personen gevonden in de data.", true);
                return;
            }
            setStatus("✅ Data geladen (" + pIds.length + " personen). Selecteer een favorietenlijst.", false);
        } catch (err) {
            setStatus("⚠️ Fout bij verwerken data: " + err.message, true);
        }
    }

    window.addEventListener('load', function() {
        initTreeFromIndexedDB();
    });

    function getAncestorsWithPaths(startId, maxGenerations) {
        var ancestors = {};
        var queue = [{ id: startId, path: [startId] }];
        while (queue.length > 0) {
            var item = queue.shift();
            if (item.path.length > maxGenerations) continue;
            var pObj = personsDB[item.id];
            if (!pObj) continue;
            pObj.parents.forEach(function(pId) {
                if (!ancestors[pId]) {
                    var newPath = item.path.concat([pId]);
                    ancestors[pId] = newPath;
                    queue.push({ id: pId, path: newPath });
                }
            });
        }
        return ancestors;
    }

    function findBloodRelationships(targetList, maxGen) {
        var nodesToInclude = new Set(targetList);
        var ancestorDict = {};
        targetList.forEach(function(tId) {
            ancestorDict[tId] = getAncestorsWithPaths(tId, maxGen);
        });

        for (var i = 0; i < targetList.length; i++) {
            for (var j = i + 1; j < targetList.length; j++) {
                var p1 = targetList[i], p2 = targetList[j];
                var anc1 = ancestorDict[p1] || {}, anc2 = ancestorDict[p2] || {};
                var common = Object.keys(anc1).filter(a => a in anc2);
                common.forEach(function(mrca) {
                    (anc1[mrca] || []).forEach(n => nodesToInclude.add(n));
                    (anc2[mrca] || []).forEach(n => nodesToInclude.add(n));
                });
            }
        }
        return nodesToInclude;
    }

    function findShortestAnyPath(targetList) {
        var nodesToInclude = new Set(targetList);
        targetList.forEach(function(startId) {
            var visited = new Set([startId]);
            var queue = [[startId]];
            while (queue.length > 0) {
                var path = queue.shift();
                var node = path[path.length - 1];
                if (targetList.includes(node) && node !== startId) {
                    path.forEach(n => nodesToInclude.add(n));
                }
                var pObj = personsDB[node];
                if (!pObj) continue;
                var neighbors = [].concat(pObj.parents, pObj.children, pObj.spouses);
                neighbors.forEach(function(nbr) {
                    if (nbr && !visited.has(nbr)) {
                        visited.add(nbr);
                        queue.push(path.concat([nbr]));
                    }
                });
            }
        });
        return nodesToInclude;
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btnBlood').className = 'btn btn-mode' + (mode === 'blood' ? ' active' : '');
        document.getElementById('btnShortest').className = 'btn btn-mode' + (mode === 'shortest' ? ' active' : '');
        calculateAndRender();
    }

    function calculateAndRender() {
        var select = document.getElementById('favoriteListSelect');
        var opt = select.options[select.selectedIndex];
        
        if (!opt || !opt.dataset.ids) {
            setStatus("⚠️ Selecteer eerst een favorietenlijst.", true);
            return;
        }

        var targetList = JSON.parse(opt.dataset.ids);
        currentTargetSet.clear();
        targetList.forEach(id => {
            if (personsDB[id]) currentTargetSet.add(id);
        });

        var maxGen = parseInt(document.getElementById('maxGenInput').value, 10);
        if (isNaN(maxGen) || maxGen < 1) maxGen = 10;

        if (targetList.length === 0) {
            setStatus("⚠️ De geselecteerde favorietenlijst is leeg.", true);
            return;
        }

        var nodesToInclude = (currentMode === 'blood') 
            ? findBloodRelationships(targetList, maxGen) 
            : findShortestAnyPath(targetList);

        if (nodesToInclude.size === 0) {
            setStatus("⚠️ Geen relaties gevonden tussen personen in deze lijst binnen deze limiet.", true);
            return;
        }

        renderNetworkGraph(nodesToInclude, currentTargetSet, targetList);
        setStatus("✅ Stamboom met stamouders bovenaan (" + nodesToInclude.size + " personen) uit lijst: " + opt.text, false);
    }

    var currentAdjMap = {};

    // Hulpfunctie om generatie-niveaus te berekenen zodat stamouders altijd op level 0 (bovenaan) komen
    function computeNodeLevels(nodesSet) {
        var nodeLevels = {};
        var roots = [];

        // Zoek wie in deze set geen ouders heeft binnen de set (de stamouders)
        nodesSet.forEach(function(id) {
            var p = personsDB[id];
            if (!p) return;
            var hasParentInSet = p.parents.some(parId => nodesSet.has(parId));
            if (!hasParentInSet) {
                roots.push(id);
                nodeLevels[id] = 0;
            }
        });

        // Breedte-Eerste Zoektocht (BFS) om niveaus omlaag door te rekenen
        var queue = roots.map(id => ({ id: id, level: 0 }));
        while (queue.length > 0) {
            var current = queue.shift();
            var p = personsDB[current.id];
            if (!p) continue;

            p.children.forEach(function(cId) {
                if (nodesSet.has(cId)) {
                    var nextLevel = current.level + 1;
                    if (nodeLevels[cId] === undefined || nodeLevels[cId] < nextLevel) {
                        nodeLevels[cId] = nextLevel;
                        queue.push({ id: cId, level: nextLevel });
                    }
                }
            });

            // Zorg ervoor dat partners op exact dezelfde hoogte (level) komen te staan
            p.spouses.forEach(function(sId) {
                if (nodesSet.has(sId)) {
                    if (nodeLevels[sId] === undefined && nodeLevels[current.id] !== undefined) {
                        nodeLevels[sId] = nodeLevels[current.id];
                        queue.push({ id: sId, level: nodeLevels[current.id] });
                    }
                }
            });
        }

        return nodeLevels;
    }

    function renderNetworkGraph(nodesToInclude, targetSet, targetList) {
        nodesDataSet.clear();
        edgesDataSet.clear();
        currentAdjMap = {};
        lastSelectedPathNames = [];
        lastPathStartName = "";
        lastPathEndName = "";
        lastPathCode = "";
        changeIndices = [];

        // Bereken vooraf de niveaus zodat stamouders geforceerd bovenaan komen
        var nodeLevels = computeNodeLevels(nodesToInclude);

        var newNodes = [];
        var edgesSet = new Set();

        nodesToInclude.forEach(function(id) {
            var p = personsDB[id];
            if (!p) return;

            var isTarget = targetSet.has(id);
            var colorFill = p.gender === 'F' ? "#FFC0CB" : "#97C2FC";
            var borderColor = isTarget ? "#D32F2F" : "#555555";
            var borderWidth = isTarget ? 4 : 1;
            var shape = isTarget ? "ellipse" : "box";

            var nodeConfig = {
                id: id,
                label: p.name + (p.years ? "\n" + p.years : ""),
                shape: shape,
                color: { background: colorFill, border: borderColor, highlight: { background: "#FFE082", border: "#FF6F00" } },
                borderWidth: borderWidth
            };

            // Wijs het berekende generatieniveau toe indien bekend
            if (nodeLevels[id] !== undefined) {
                nodeConfig.level = nodeLevels[id];
            }

            newNodes.push(nodeConfig);
            currentAdjMap[id] = [];
        });

        nodesToInclude.forEach(function(id) {
            var p = personsDB[id];
            if (!p) return;

            p.spouses.forEach(function(sId) {
                if (nodesToInclude.has(sId)) {
                    var pairKey = [id, sId].sort().join('-partner-');
                    edgesSet.add(JSON.stringify({ key: pairKey, from: id, to: sId, label: "partner", color: { color: "#E91E63" }, dashes: true, arrows: { to: false } }));
                }
            });

            p.children.forEach(function(cId) {
                if (nodesToInclude.has(cId)) {
                    var pairKey = id + '->' + cId + '-parent';
                    edgesSet.add(JSON.stringify({ key: pairKey, from: id, to: cId, label: "ouder van", color: { color: "#4CAF50" }, arrows: { to: { enabled: true, type: "arrow" } } }));
                }
            });
        });

        var newEdges = [];
        var edgeIndex = 0;
        edgesSet.forEach(function(str) {
            var e = JSON.parse(str);
            e.id = "e_" + (edgeIndex++);
            newEdges.push(e);
            if (currentAdjMap[e.from]) currentAdjMap[e.from].push({ neighbor: e.to, edgeId: e.id });
            if (currentAdjMap[e.to]) currentAdjMap[e.to].push({ neighbor: e.from, edgeId: e.id });
        });

        nodesDataSet.add(newNodes);
        edgesDataSet.add(newEdges);
        network.fit();
    }

    function getRelationCodeChar(fromId, toId) {
        var fromP = personsDB[fromId];
        var toP = personsDB[toId];
        if (!fromP || !toP) return '?';

        if (fromP.parents.includes(toId)) {
            return toP.gender === 'F' ? 'M' : 'V';
        }
        if (fromP.children.includes(toId)) {
            return 'K';
        }
        if (fromP.spouses.includes(toId)) {
            return 'P';
        }
        return '?';
    }

    function highlightPathBetween(startId, endId) {
        var queue = [[startId]];
        var visited = new Set([startId]);
        var targetPath = null;

        while (queue.length > 0) {
            var path = queue.shift();
            var current = path[path.length - 1];
            if (current === endId) { targetPath = path; break; }
            (currentAdjMap[current] || []).forEach(function(item) {
                if (!visited.has(item.neighbor)) {
                    visited.add(item.neighbor);
                    queue.push(path.concat([item.neighbor]));
                }
            });
        }
        if (!targetPath) return;

        var startPerson = personsDB[startId];
        var endPerson = personsDB[endId];
        lastPathStartName = startPerson ? startPerson.name : startId;
        lastPathEndName = endPerson ? endPerson.name : endId;

        var codeChars = [];
        var lastGroup = ''; 
        changeIndices = [];

        for (var i = 0; i < targetPath.length - 1; i++) {
            var charCode = getRelationCodeChar(targetPath[i], targetPath[i+1]);
            var currentGroup = (charCode === 'V' || charCode === 'M') ? 'PARENT' : charCode;

            if (lastGroup !== '' && lastGroup !== currentGroup) {
                codeChars.push('-');
                changeIndices.push(i);
            }
            codeChars.push(charCode);
            lastGroup = currentGroup;
        }
        lastPathCode = codeChars.join('');

        lastSelectedPathNames = targetPath.map(function(id, idx) {
            var p = personsDB[id];
            var namePart = p ? (p.name + (p.years ? " " + p.years : "") + " (@" + id + "@)") : id;
            if (changeIndices.includes(idx)) {
                return "🔴 " + namePart + " (Richtsverandering)";
            }
            return namePart;
        });

        var pathNodesSet = new Set(targetPath);
        var pathEdgesSet = new Set();
        for (var i = 0; i < targetPath.length - 1; i++) {
            var u = targetPath[i], v = targetPath[i + 1];
            (currentAdjMap[u] || []).forEach(function(item) { if (item.neighbor === v) pathEdgesSet.add(item.edgeId); });
        }

        nodesDataSet.forEach(function(n) {
            nodesDataSet.update({ id: n.id, opacity: pathNodesSet.has(n.id) ? 1 : 0.25 });
        });
        edgesDataSet.forEach(function(e) {
            edgesDataSet.update({ id: e.id, color: { color: pathEdgesSet.has(e.id) ? "#FF6F00" : "#E0E0E0" }, width: pathEdgesSet.has(e.id) ? 4 : 1 });
        });
    }

    function resetHighlighting() {
        lastSelectedPathNames = [];
        lastPathStartName = "";
        lastPathEndName = "";
        lastPathCode = "";
        changeIndices = [];
        nodesDataSet.forEach(function(n) {
            nodesDataSet.update({ id: n.id, opacity: 1 });
        });
        edgesDataSet.forEach(function(e) {
            edgesDataSet.update({ id: e.id, color: { color: e.label === "ouder van" ? "#4CAF50" : "#E91E63" }, width: 1 });
        });
    }

    function copySelectedPath() {
        if (!lastSelectedPathNames || lastSelectedPathNames.length === 0) {
            alert("Selecteer eerst exact 2 personen in het netwerk door erop te klikken zodat het pad oplicht.");
            return;
        }

        var titleLine = "Pad van " + lastPathStartName + " naar " + lastPathEndName + " (" + lastSelectedPathNames.length + " personen, relatiecode: " + lastPathCode + "):";
        var textToCopy = titleLine + "\n" + lastSelectedPathNames.join(" ➔ ");

        navigator.clipboard.writeText(textToCopy).then(function() {
            setStatus("✅ Het pad inclusief aantal personen en relatiecode (" + lastPathCode + ") is naar het klembord gekopieerd!", false);
        }).catch(function(err) {
            alert("Kopiëren mislukt: " + err);
        });
    }
</script>
