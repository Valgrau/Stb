<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <title>Interactieve GEDCOM Stamboom (JSON)</title>
    <!-- Vis.js bibliotheek voor het renderen van het netwerk/stamboom -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style type="text/css">
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 15px;
            background-color: #FFFFFF;
        }
        #mynetwork {
            width: 100%;
            height: 75vh;
            border: 1px solid #BDBDBD;
            background-color: #F8F9FA;
            border-radius: 4px;
        }
        .toolbar {
            margin-bottom: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-reset { background-color: #f44336; color: white; }
        .btn-nav { background-color: #2196F3; color: white; }
        .btn:disabled { background-color: #CCCCCC; cursor: not-allowed; }
        .search-box {
            padding: 8px;
            font-size: 14px;
            width: 280px;
            border: 1px solid #CCC;
            border-radius: 4px;
        }
        .info-panel {
            background: #E3F2FD;
            border-left: 5px solid #2196F3;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        #status {
            font-weight: bold;
            color: #1565C0;
        }
    </style>
</head>
<body>

<h2 id="headerTitle">Stamboom Visualisatie</h2>

<div class="toolbar">
    <label for="personSelect"><b>Selecteer / Zoek persoon:</b></label>
    <input type="text" id="personInput" list="personList" class="search-box" placeholder="Typ een naam of ID..." onchange="onPersonSelected()">
    <datalist id="personList"></datalist>

    <button id="btnReset" class="btn btn-reset" onclick="resetToStart()">↺ Opnieuw Beginnen</button>
    <button id="btnUndo" class="btn btn-nav" onclick="undo()" disabled>◄ Terug</button>
    <button id="btnRedo" class="btn btn-nav" onclick="redo()" disabled>Voorwaarts ►</button>
</div>

<div class="info-panel">
    <span id="status">Bezig met laden van Gedcom.json...</span>
</div>

<div id="mynetwork"></div>

<script type="text/javascript">
    var personsDB = {};
    var familiesDB = {};
    var mainPersonId = "";

    var historyStack = [];
    var redoStack = [];

    var nodesDataSet = new vis.DataSet();
    var edgesDataSet = new vis.DataSet();

    var container = document.getElementById('mynetwork');
    var data = {
        nodes: nodesDataSet,
        edges: edgesDataSet
    };

    var options = {
        nodes: {
            font: { size: 13, face: 'arial' },
            shadow: true,
            margin: 8
        },
        edges: {
            smooth: { type: 'cubicBezier', forceDirection: 'vertical' },
            arrows: { to: { enabled: false } }
        },
        interaction: {
            hover: true,
            zoomView: true,
            dragView: true
        },
        physics: { enabled: false }
    };

    var network = new vis.Network(container, data, options);

    var BOX_WIDTH = 220;
    var LEVEL_HEIGHT = 130;

    // --- 1. PARSER VOOR DE GEDCOM JSON STRUCTUUR ---
    function parseGedcomJson(jsonObj) {
        personsDB = {};
        familiesDB = {};

        function cleanId(idStr) {
            return idStr ? String(idStr).replace(/@/g, "").trim() : null;
        }

        function getValue(elem) {
            if (!elem) return "";
            if (Array.isArray(elem)) elem = elem[0];
            return (elem && elem.value) ? elem.value : "";
        }

        function getDateValue(eventNode) {
            if (!eventNode) return "";
            if (Array.isArray(eventNode)) eventNode = eventNode[0];
            if (eventNode && eventNode.DATE) {
                return getValue(eventNode.DATE);
            }
            return "";
        }

        function getIdList(elem) {
            if (!elem) return [];
            var list = Array.isArray(elem) ? elem : [elem];
            return list.map(item => cleanId(item.value)).filter(id => id);
        }

        Object.keys(jsonObj).forEach(function(key) {
            var node = jsonObj[key];
            if (!node || typeof node !== 'object') return;

            var tag = node.TAG || "";
            var cleanKey = cleanId(key);

            if (tag === "INDI") {
                var rawName = getValue(node.NAME);
                var cleanName = rawName.replace(/\//g, "").trim();
                
                var parentFam = node.FAMC ? cleanId(node.FAMC.value) : null;
                var spouseFams = getIdList(node.FAMS);

                var birtDate = getDateValue(node.BIRT);
                var deatDate = getDateValue(node.DEAT);

                personsDB[cleanKey] = {
                    type: "INDI",
                    id: cleanKey,
                    name: cleanName || "Onbekend",
                    birtDate: birtDate,
                    deatDate: deatDate,
                    parentFam: parentFam,
                    spouseFams: spouseFams
                };
            } else if (tag === "FAM") {
                var husband = node.HUSB ? cleanId(node.HUSB.value) : null;
                var wife = node.WIFE ? cleanId(node.WIFE.value) : null;
                var children = getIdList(node.CHIL);

                familiesDB[cleanKey] = {
                    type: "FAM",
                    id: cleanKey,
                    husband: husband,
                    wife: wife,
                    children: children
                };
            }
        });

        // Bereken jaartallen string voor elke persoon
        Object.keys(personsDB).forEach(function(id) {
            var p = personsDB[id];
            var birt = p.birtDate || "";
            var deat = p.deatDate || "";
            p.years = (birt || deat) ? "(" + birt + " - " + deat + ")" : "";
            if (!p.name) p.name = "Onbekend";
        });
    }

    // --- 2. LAAD HET JSON BESTAND VIA FETCH ---
    fetch('Gedcom.json')
        .then(response => {
            if (!response.ok) {
                throw new Error("Gedcom.json niet gevonden of kon niet geladen worden.");
            }
            return response.json();
        })
        .then(jsonData => {
            parseGedcomJson(jsonData);
            
            var personIds = Object.keys(personsDB);
            if (personIds.length === 0) {
                document.getElementById('status').innerText = "Fout: Geen personen gevonden in Gedcom.json";
                return;
            }

            // Vul de zoekbalk / datalist
            var datalist = document.getElementById('personList');
            datalist.innerHTML = "";
            personIds.forEach(function(id) {
                var p = personsDB[id];
                var option = document.createElement('option');
                option.value = p.name + " (" + id + ")";
                datalist.appendChild(option);
            });

            // Koppel standaard de eerste persoon (of specifiek I5147 als deze bestaat)
            mainPersonId = personsDB["I5147"] ? "I5147" : personIds[0];
            
            document.getElementById('status').innerText = "Gedcom.json succesvol geladen (" + personIds.length + " personen). Klik op een persoon in het netwerk om uit te klappen.";
            
            resetToStart();
        })
        .catch(error => {
            document.getElementById('status').innerText = "Fout bij laden: " + error.message;
        });

    // --- 3. LAYOUT & VISUALISATIE LOGICA ---
    function isPositionOccupied(x, y) {
        var allNodes = nodesDataSet.get();
        for (var i = 0; i < allNodes.length; i++) {
            var n = allNodes[i];
            if (Math.abs(n.x - x) < (BOX_WIDTH - 20) && Math.abs(n.y - y) < 40) {
                return true;
            }
        }
        return false;
    }

    function findFreeX(targetX, targetY) {
        var x = targetX;
        var offset = 0;
        var step = BOX_WIDTH;
        
        while (isPositionOccupied(x, targetY)) {
            if (offset <= 0) {
                offset = -offset + step;
            } else {
                offset = -offset;
            }
            x = targetX + offset;
        }
        return x;
    }

    function addPersonNode(personId, x, y) {
        var existing = nodesDataSet.get(personId);
        if (existing) return existing;

        var p = personsDB[personId];
        if (!p) return null;

        var isMain = (personId === mainPersonId);

        var nodeData = {
            id: p.id,
            label: p.name
